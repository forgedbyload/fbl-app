  async function saveSession() {
    const weekday = document.querySelector('.t-toggle[data-weekday].on')?.dataset.weekday;
    const mode    = document.querySelector('.t-toggle[data-sesmode].on')?.dataset.sesmode;
    if (!weekday || !mode) { toast('Wochentag und Modus wählen'); return; }
    const isFlex = mode === 'flexibility';
    const payload = {
      week:         planWeek,
      weekday,
      dup_mode:     mode,
      exercise_ids: sesSelectedIds.map(s => ({ exercise_id: s.exercise_id, sets: s.sets || 3 })),
      work_seconds: (isFlex || mode === 'kraft') ? null : (parseInt(document.getElementById('ses-work').value) || null),
      rest_seconds: isFlex ? null : (parseInt(document.getElementById('ses-rest').value) || null),
      title:        document.getElementById('ses-title').value.trim() || null,
    };
    for (const item of sesSelectedIds) {
      const ex = exercises.find(e => e.id === item.exercise_id);
      if (ex) {
        const wa = ex.week_assignment || [];
        if (!wa.includes(planWeek)) {
          const updated = [...wa, planWeek];
          await db.from('exercises').update({ week_assignment: updated }).eq('id', item.exercise_id);
          ex.week_assignment = updated;
        }
      }
    }
    let error, savedId = editingSessionId;
    if (editingSessionId) {
      ({ error } = await db.from('sessions').update(payload).eq('id', editingSessionId));
    } else {
      let newData;
      ({ data: newData, error } = await db.from('sessions').insert([payload]).select().single());
      if (newData) { savedId = newData.id; editingSessionId = savedId; }
    }
    if (error) { toast('Fehler beim Speichern'); return; }
    toast(editingSessionId ? 'Session gespeichert' : 'Session erstellt');
    await loadSessions();
    renderPlan();
    render();
    const saved = sessions.find(s => s.id === savedId);
    if (saved) { enterSesViewMode(saved); return; }
    closeSessionModal();
  }

  async function deleteSession() {
    if (!editingSessionId) return;
    const { error } = await db.from('sessions').delete().eq('id', editingSessionId);
    if (error) { toast('Fehler beim Löschen'); return; }
    toast('Session gelöscht');
    closeSessionModal();
    await loadSessions();
    renderPlan();
  }

  // ═══════════════════════════════════════════════════════
  let tSession = null;
  let selIds   = new Set();
  let tMode, tWeek, tExercises, exIdx, setIdx, phase;
  let tStart, tDuration, tPaused, tPausedRem, rafId, sessionStart;
  let lastBeepSecond = -1;

  // ── Set-Log state ─────────────────────────────────────
  let slCallback = null;
  let slPRs      = {};
  let slRIR      = null;

  const SL_EQ_ORDER  = ['barbell','dumbbell_1x','dumbbell_2x','kettlebell_1x','kettlebell_2x'];
  const SL_EQ_LABELS = { barbell:'Barbell', dumbbell_1x:'Dumbbell 1x', dumbbell_2x:'Dumbbell 2x', kettlebell_1x:'KB 1x', kettlebell_2x:'KB 2x' };

  function computeTotalSets() {
    return tExercises[exIdx]?._sets || 3;
  }

  function slCheckPR(eq) {
    const inp   = document.getElementById(`sl-w-${eq}`);
    const badge = document.getElementById(`sl-pr-${eq}`);
    if (!inp || !badge) return;
    const val = parseFloat(inp.value);
    badge.style.display = (!isNaN(val) && val > 0 && (slPRs[eq] == null || val > slPRs[eq])) ? 'inline' : 'none';
  }

  async function openSetLogModal(cb) {
    slCallback = cb;
    slRIR      = null;
    const ex   = tExercises[exIdx];

    const { data } = await db.from('set_log')
      .select('equipment,weight_kg,reps,rir')
      .eq('exercise_id', ex.id)
      .order('created_at', { ascending: false })
      .limit(100);

    const lastByEq = {};
    slPRs = {};
    (data || []).forEach(row => {
      if (!lastByEq[row.equipment]) lastByEq[row.equipment] = row;
      if (row.weight_kg != null && (slPRs[row.equipment] == null || row.weight_kg > slPRs[row.equipment]))
        slPRs[row.equipment] = row.weight_kg;
    });

    const totalSets = computeTotalSets();
    document.getElementById('sl-title').textContent    = ex.name;
    document.getElementById('sl-set-info').textContent = `Satz ${setIdx + 1} · Session gesamt: ${totalSets} Sätze`;

    document.getElementById('sl-eq-rows').innerHTML = SL_EQ_ORDER.map(eq => {
      const val = lastByEq[eq]?.weight_kg ?? '';
      return `<div class="sl-eq-row">
        <span class="sl-eq-label">${SL_EQ_LABELS[eq]}</span>
        <input class="form-input" type="number" step="0.5" inputmode="decimal" id="sl-w-${eq}" placeholder="kg" value="${val}" data-eq="${eq}">
        <span class="sl-pr-badge" id="sl-pr-${eq}">PR</span>
      </div>`;
    }).join('');

    const anyLast = Object.values(lastByEq)[0];
    document.getElementById('sl-reps').value = anyLast?.reps ?? '';
    document.querySelectorAll('.sl-rir-btn').forEach(b => b.classList.remove('on'));

    SL_EQ_ORDER.forEach(eq => {
      const inp = document.getElementById(`sl-w-${eq}`);
      inp?.addEventListener('input', () => slCheckPR(eq));
      slCheckPR(eq);
    });

    document.getElementById('setlog-overlay').classList.add('open');
  }

  async function saveSetLogAndContinue() {
    const ex      = tExercises[exIdx];
    const reps    = parseInt(document.getElementById('sl-reps').value) || null;
    const today   = new Date().toISOString().split('T')[0];
    const total   = computeTotalSets();
    const setNum  = setIdx + 1;
    const rows    = [];

    SL_EQ_ORDER.forEach(eq => {
      const val = parseFloat(document.getElementById(`sl-w-${eq}`)?.value);
      if (!isNaN(val) && val > 0) {
        rows.push({
          exercise_id:           ex.id,
          session_id:            tSession?.id ?? null,
          session_date:          today,
          set_number:            setNum,
          total_sets_in_session: total,
          weight_kg:             val,
          reps,
          rir:                   slRIR,
          equipment:             eq,
        });
      }
    });

    if (!rows.length && (reps || slRIR != null)) {
      rows.push({
        exercise_id:           ex.id,
        session_id:            tSession?.id ?? null,
        session_date:          today,
        set_number:            setNum,
        total_sets_in_session: total,
        weight_kg:             null,
        reps,
        rir:                   slRIR,
        equipment:             null,
      });
    }
    if (rows.length) {
      const { error } = await db.from('set_log').insert(rows);
      if (error) toast('Fehler beim Speichern');
    }

    document.getElementById('setlog-overlay').classList.remove('open');
    const cb = slCallback; slCallback = null;
    if (cb) cb();
  }

  document.getElementById('sl-close').addEventListener('click', () => {
    document.getElementById('setlog-overlay').classList.remove('open');

    if (cb) cb();

  document.getElementById('sl-confirm').addEventListener('click', saveSetLogAndContinue);

    btn.addEventListener('click', () => {

  let _audioCtx = null;
  function getAudioCtx() {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return _audioCtx;
  }
  function playBeep(hz = 440, ms = 100) {
    try {
      const ctx  = getAudioCtx();
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = hz;
      gain.gain.setValueAtTime(0.35, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + ms / 1000);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + ms / 1000);
    } catch(e) {}
  }

  const timerSelect = document.getElementById('timer-select');
  const timerActive = document.getElementById('timer-active');
  const timerDone   = document.getElementById('timer-done');
  const selInfo     = document.getElementById('sel-info');
  const selListEl   = document.getElementById('sel-list');
  const taModeLbl   = document.getElementById('ta-mode-label');
  const taCounter   = document.getElementById('ta-counter');
  const taImg       = document.getElementById('ta-img');
  const taName      = document.getElementById('ta-name');
  const taDots      = document.getElementById('ta-dots');
  const ringFill    = document.getElementById('ring-fill');
  const taTime      = document.getElementById('ta-time');
  const taPhase     = document.getElementById('ta-phase');
  const taPauseHint = document.getElementById('ta-pause-hint');
  const taSkip      = document.getElementById('ta-skip');
  const taMain      = document.getElementById('ta-main');
  const doneMeta    = document.getElementById('done-meta');

  function showTimerSub(which) {
    timerSelect.style.display = which==='select' ? 'block' : 'none';
    timerActive.style.display = which==='active' ? 'flex' : 'none';
    timerDone.style.display   = which==='done'   ? 'block' : 'none';
  }

  async function loadAppState() {
    const { data } = await db.from('app_state').select('*').limit(1).single();
    if (data) appState = data;
  }

  async function openTimerSelect() {
    await loadAppState();
    await loadSessions();
    tWeek = appState.current_week || 'A';
    tSession = null;
    selIds = new Set();
    const lbl = document.getElementById('sel-week-label');
    lbl.textContent = `Woche ${tWeek}`;
    lbl.style.color = tWeek==='A' ? 'var(--kraft)' : 'var(--hyper)';
    renderTimerSessionList();
    document.getElementById('sel-sessions-list').style.display = 'block';
    document.getElementById('sel-exercises-container').style.display = 'none';
    showTimerSub('select');
  }

  function renderTimerSessionList() {
    const weekSessions = sessions.filter(s => s.week === tWeek);
    let html = '';
    DAYS.forEach(day => {
      const ds = weekSessions.filter(s => s.weekday === day);
      if (!ds.length) return;
      html += `<div class="sel-day-header">${DAY_LABELS[day]}</div>`;
      html += ds.map(s => {
        const exCount = (s.exercise_ids||[]).length;
        const timeStr = s.dup_mode==='flexibility' ? 'Flexibility' : `${s.work_seconds||'?'}s / ${s.rest_seconds||'?'}s`;
        return `<div class="sel-session-item" data-id="${s.id}">
          <div>
            <div class="sel-session-title">${s.title || cap(s.dup_mode)}</div>
            <div class="sel-session-meta">${exCount} Übungen · ${timeStr}</div>
          </div>
          <span class="session-mode-badge mode-${s.dup_mode}">${cap(s.dup_mode)}</span>
        </div>`;
      }).join('');
    });
    if (!html) html = `<div class="sel-empty">Keine Sessions für Woche ${tWeek}.<br>Im Wochenplan anlegen.</div>`;
    document.getElementById('sel-sessions-list').innerHTML = html;
    document.querySelectorAll('.sel-session-item').forEach(item =>
      item.addEventListener('click', () => selectSession(sessions.find(s=>s.id===item.dataset.id))));
  }

  function selectSession(ses) {
    if (!ses) return;
    tSession = ses;
    tMode    = ses.dup_mode;
    const pool = (ses.exercise_ids||[]).map(cfg => {
      const id   = typeof cfg === 'string' ? cfg : cfg.exercise_id;
      const sets = typeof cfg === 'object' ? (cfg.sets || 3) : 3;
      const ex   = exercises.find(e => e.id === id);
      return ex ? { ...ex, _sets: sets } : null;
    }).filter(Boolean);
    selIds = new Set(pool.map(e=>e.id));
    const isFlex = tMode === 'flexibility';
    const timeStr = isFlex ? '' : ` · ${ses.work_seconds||'?'}s / ${ses.rest_seconds||'?'}s`;
    selInfo.innerHTML = `<div class="sel-info-mode" style="color:var(--${isFlex?'flex':tMode})">${ses.title||cap(tMode)}</div><div class="sel-info-meta">${pool.length} Übungen${timeStr}</div>`;
    selListEl.innerHTML = pool.map(e =>
      `<div class="sel-exercise-item on" data-id="${e.id}"><div class="sel-check">✓</div><div class="sel-ex-name">${e.name}</div></div>`
    ).join('');
    selListEl.querySelectorAll('.sel-exercise-item').forEach(item => {
      item.addEventListener('click', () => {
        const id = item.dataset.id;
        if (selIds.has(id)) { selIds.delete(id); item.classList.remove('on'); item.querySelector('.sel-check').textContent=''; }
        else                { selIds.add(id);    item.classList.add('on');    item.querySelector('.sel-check').textContent='✓'; }
      });
    });
    document.getElementById('sel-sessions-list').style.display = 'none';
    document.getElementById('sel-exercises-container').style.display = 'block';
  }

  document.getElementById('btn-back-sessions').addEventListener('click', () => {
    tSession = null;
    document.getElementById('sel-sessions-list').style.display = 'block';
    document.getElementById('sel-exercises-container').style.display = 'none';
  });

  document.getElementById('btn-start').addEventListener('click', async () => {
    getAudioCtx().resume();
    const pool = (tSession.exercise_ids||[]).map(cfg => {
      const id   = typeof cfg === 'string' ? cfg : cfg.exercise_id;
      const sets = typeof cfg === 'object' ? (cfg.sets || 3) : 3;
      const ex   = exercises.find(e => e.id === id);
      return ex ? { ...ex, _sets: sets } : null;
    }).filter(Boolean);
    tExercises = pool.filter(e=>selIds.has(e.id));
    if (!tExercises.length) { toast('Keine Übungen ausgewählt'); return; }
    const { data: gifRows } = await db.from('exercises').select('id,gif_base64').in('id', tExercises.map(e=>e.id));
    if (gifRows) {
      const gifMap = Object.fromEntries(gifRows.map(r => [r.id, r.gif_base64]));
      tExercises = tExercises.map(e => ({ ...e, gif_base64: gifMap[e.id] ?? null }));
    }
    exIdx = 0; setIdx = 0;
    sessionStart = Date.now();
    taModeLbl.textContent = tSession.title || `${cap(tMode)} · ${tWeek}`;
    ringFill.style.stroke  = `var(--${tMode==='flexibility'?'flex':tMode})`;
    resetTimerUI();
    showTimerSub('active');
    startExercise();
  });

  function resetTimerUI() {
    document.getElementById('ta-ring-wrap').style.display = 'block';
    document.getElementById('ta-flex-controls').style.display = 'none';
    document.getElementById('ta-btns').style.display = 'grid';
    document.getElementById('ta-next-preview').style.display = 'none';
    document.getElementById('ta-weight-hint').style.display = 'none';
  }

  // ── Exercise / set logic ──────────────────────────────
  function startExercise() {
    updateExDisplay();
    if (tMode === 'flexibility') {
      enterFlexMode();
    } else if (tMode === 'kraft') {
      enterRepsPhase();
    } else {
      startPhase('work', tSession?.work_seconds ?? DUP_CFG[tMode].workTime);
    }
  }

  function updateExDisplay() {
    const ex  = tExercises[exIdx];
    const cfg = DUP_CFG[tMode];
    taImg.innerHTML  = ex.gif_base64 ? `<img src="${ex.gif_base64}" loading="lazy">` : `<span class="ta-img-ph">💪</span>`;
    taName.textContent = ex.name;
    taCounter.textContent = `${exIdx+1} / ${tExercises.length}`;
    const wHint = document.getElementById('ta-weight-hint');
    if (tMode === 'kraft') {
      const totalSets = ex._sets || 3;
      taDots.innerHTML = `<span class="satz-progress">Satz ${setIdx+1} / ${totalSets}</span>`;
      const sw = ex.strength_weights;
      if (sw?.length) {
        const WLBLS = { barbell:'BB', dumbbell_1x:'DB 1x', dumbbell_2x:'DB 2x', kettlebell_1x:'KB 1x', kettlebell_2x:'KB 2x' };
        const parts = sw.filter(w=>w.working_weight).map(w=>`${WLBLS[w.type]||w.type}: ${w.working_weight}kg`);
        wHint.textContent = parts.join(' · ');
        wHint.style.display = parts.length ? 'block' : 'none';
      } else { wHint.style.display = 'none'; }
    } else if (tMode !== 'flexibility') {
      taDots.innerHTML = Array.from({length:cfg.sets},(_,i)=>
        `<span class="set-dot${i<setIdx?' done':i===setIdx?' active':''}"></span>`).join('');
      wHint.style.display = 'none';
    } else {
      taDots.innerHTML = '';
      wHint.style.display = 'none';
    }
  }

  function enterFlexMode() {
    phase = 'flex';
    if (rafId) { cancelAnimationFrame(rafId); rafId=null; }
    document.getElementById('ta-ring-wrap').style.display = 'none';
    document.getElementById('ta-flex-controls').style.display = 'flex';
    document.getElementById('ta-btns').style.display = 'none';
    document.getElementById('ta-next-preview').style.display = 'none';
    taPhase.textContent = 'FLEXIBILITY';
    taPauseHint.textContent = '';
    taTime.textContent = '';
    updateFlexControls();
  }

  function updateFlexControls() {
    document.getElementById('ta-flex-prev').disabled = exIdx === 0;
    const nextBtn = document.getElementById('ta-flex-next');
    nextBtn.textContent = exIdx >= tExercises.length-1 ? 'Fertig' : 'Weiter →';
    nextBtn.disabled = false;
  }

  document.getElementById('ta-flex-prev').addEventListener('click', () => {
    if (exIdx > 0) { exIdx--; updateExDisplay(); updateFlexControls(); }
  });
  document.getElementById('ta-flex-next').addEventListener('click', () => {
    if (exIdx >= tExercises.length-1) { showDone(); }
    else { exIdx++; updateExDisplay(); updateFlexControls(); }
  });

  function enterRepsPhase() {
    phase = 'reps';
    if (rafId) { cancelAnimationFrame(rafId); rafId=null; }
    setRing(1); ringFill.classList.add('pulsing');
    taTime.textContent='—'; taPhase.textContent='AUSFÜHREN'; taPauseHint.textContent='';
    taMain.textContent='Satz beendet'; taMain.classList.remove('ta-hidden');
    taSkip.classList.add('ta-hidden');
    document.getElementById('ta-next-preview').style.display = 'none';
  }

  function startPhase(ph, dur) {
    phase=ph; tDuration=dur; tStart=Date.now(); tPaused=false; tPausedRem=dur; lastBeepSecond=-1;
    ringFill.classList.remove('pulsing');
    taPhase.textContent = ph==='work' ? 'ARBEIT' : 'PAUSE';
    taPauseHint.textContent = 'Tippen zum Pausieren';
    taMain.classList.add('ta-hidden');
    taSkip.classList.remove('ta-hidden');
    taSkip.textContent = ph==='work' ? 'Überspringen' : 'Pause skip';
    setRing(1); setTimeDisplay(dur);
    if (ph === 'rest') {
      const nextEx = getNextExercise();
      if (nextEx) {
        document.getElementById('ta-next-preview').style.display = 'block';
        document.getElementById('ta-next-thumb').innerHTML = nextEx.gif_base64
          ? `<img src="${nextEx.gif_base64}" style="width:100%;height:100%;object-fit:cover">`
          : '💪';
        document.getElementById('ta-next-ex-name').textContent = nextEx.name;
      } else {
        document.getElementById('ta-next-preview').style.display = 'none';
      }
    } else {
      document.getElementById('ta-next-preview').style.display = 'none';
    }
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(timerTick);
  }

  function getNextExercise() {
    const totalSets = tMode === 'kraft' ? (tExercises[exIdx]?._sets || 3) : DUP_CFG[tMode].sets;
    const nextExIdx = (setIdx+1 >= totalSets) ? exIdx+1 : exIdx;
    return nextExIdx < tExercises.length ? tExercises[nextExIdx] : null;
  }

  function timerTick() {
    if (tPaused) return;
    const elapsed   = (Date.now() - tStart) / 1000;
    const remaining = Math.max(0, tDuration - elapsed);
    setRing(remaining / tDuration);
    setTimeDisplay(remaining);
    const sec = Math.ceil(remaining);
    if (phase === 'rest' && remaining > 0 && sec <= 5 && sec !== lastBeepSecond) {
      lastBeepSecond = sec;
      sec === 1 ? playBeep(880, 150) : playBeep(440, 100);
    }
    if (remaining <= 0) { onPhaseEnd(); } else { rafId = requestAnimationFrame(timerTick); }
  }

  function onPhaseEnd() {
    if (rafId) { cancelAnimationFrame(rafId); rafId=null; }
    if (phase==='work') openSetLogModal(() => startPhase('rest', tSession?.rest_seconds ?? DUP_CFG[tMode].restTime));
    else nextSet();
  }

  function nextSet() {
    setIdx++;
    const totalSets = tMode === 'kraft' ? (tExercises[exIdx]?._sets || 3) : DUP_CFG[tMode].sets;
    if (setIdx >= totalSets) { exIdx++; setIdx=0; }
    if (exIdx >= tExercises.length) { showDone(); return; }
    startExercise();
  }

  // ── Pause (tap ring) ──────────────────────────────────
  document.getElementById('ta-ring-wrap').addEventListener('click', () => {
    if (phase==='reps') return;
    if (tPaused) {
      tStart = Date.now() - (tDuration - tPausedRem)*1000;
      tPaused = false; taPauseHint.textContent = 'Tippen zum Pausieren';
      rafId = requestAnimationFrame(timerTick);
    } else {
      tPausedRem = Math.max(0, tDuration - (Date.now()-tStart)/1000);
      tPaused = true;
      if (rafId) { cancelAnimationFrame(rafId); rafId=null; }
      taPauseHint.textContent = '⏸ Fortsetzen';
    }
  });

  taSkip.addEventListener('click', () => {
    if (rafId) { cancelAnimationFrame(rafId); rafId=null; }
    if (phase==='work') startPhase('rest', tSession?.rest_seconds ?? DUP_CFG[tMode].restTime);
    else nextSet();
  });

  taMain.addEventListener('click', () => {
    if (phase!=='reps') return;
    openSetLogModal(() => startPhase('rest', tSession?.rest_seconds ?? DUP_CFG.kraft.restTime));
  });

  document.getElementById('ta-exit').addEventListener('click', () => {
    if (rafId) { cancelAnimationFrame(rafId); rafId=null; }
    resetTimerUI();
    document.getElementById('sel-sessions-list').style.display = 'block';
    document.getElementById('sel-exercises-container').style.display = 'none';
    tSession = null;
    showTimerSub('select');
  });

  function showDone() {
    if (rafId) { cancelAnimationFrame(rafId); rafId=null; }
    const mins = Math.round((Date.now()-sessionStart)/60000);
    const isFlex = tMode === 'flexibility';
    const sets = isFlex ? tExercises.length
      : tMode === 'kraft' ? tExercises.reduce((s,e)=>s+(e._sets||3),0)
      : tExercises.length * DUP_CFG[tMode].sets;
    doneMeta.innerHTML = `${tSession?.title||cap(tMode)} · Woche ${tWeek}<br>${tExercises.length} Übungen · ${sets} ${isFlex?'Exercises':'Sätze'} · ${mins} Min.`;
    resetTimerUI();
    showTimerSub('done');
  }

  document.getElementById('btn-save-session').addEventListener('click', async () => {
    const mins   = Math.round((Date.now()-sessionStart)/60000);
    const isFlex = tMode === 'flexibility';
    const sets   = isFlex ? 0 : tMode === 'kraft' ? tExercises.reduce((s,e)=>s+(e._sets||3),0) : tExercises.length * DUP_CFG[tMode].sets;
    const { error } = await db.from('training_log').insert([{
      date:             new Date().toISOString().split('T')[0],
      session_type:     tMode,
      week:             tWeek,
      exercises_done:   tExercises.map(e=>e.id),
      sets_completed:   sets,
      duration_minutes: mins,
    }]);
    if (error) { toast('Fehler beim Speichern'); return; }
    const newWeek = await recalcCurrentWeek();
    const patch = { current_week: newWeek };
    Object.assign(appState, patch);
    if (appState.id) await db.from('app_state').update(patch).eq('id', appState.id);
    toast('Training gespeichert');
    goHome();
  });

  document.getElementById('btn-discard').addEventListener('click', () => {
    if (rafId) { cancelAnimationFrame(rafId); rafId=null; }
    resetTimerUI();
    goHome();
  });

  function goHome() {
    tSession = null;
    selIds = new Set();
    document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
    document.getElementById('library-view').classList.remove('hidden');
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.querySelector('.nav-btn[data-view="library-view"]').classList.add('active');
  }

  // ── Ring / time helpers ───────────────────────────────
  function setRing(progress) {
    ringFill.style.strokeDashoffset = CIRC * (1 - Math.max(0, Math.min(1, progress)));
  }
  function setTimeDisplay(seconds) {
    const s = Math.ceil(seconds), m = Math.floor(s/60), sec = s%60;
    taTime.textContent = `${m}:${String(sec).padStart(2,'0')}`;
  }

  // ── Week A/B auto-calculation ──────────────────────────
  async function recalcCurrentWeek() {
    const { count } = await db.from('training_log').select('*', { count:'exact', head:true });
    const week = Math.floor((count||0) / 6) % 2 === 0 ? 'A' : 'B';
    appState.current_week = week;
    return week;
  }

  // ═══════════════════════════════════════════════════════
  // Util
  // ═══════════════════════════════════════════════════════
  function cap(s) { return s ? s.charAt(0).toUpperCase()+s.slice(1) : ''; }

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  load();
</script>
</body>
</html>
