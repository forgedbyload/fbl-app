<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>fbl-app</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d0d0d;
      --surface: #161616;
      --border:  #242424;
      --text:    #f0ece4;
      --muted:   #666666;
      --kraft:   #c8a96e;
      --hyper:   #5daab0;
      --vol:     #9b8ab4;
      --flex:    #7ba8c4;
      --nav-h:   62px;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      height: 100%;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Views ── */
    .view {
      position: fixed;
      top: 0; left: 0; right: 0;
      bottom: var(--nav-h);
      overflow-y: auto;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }
    .view.hidden { display: none; }

    /* ── Bottom Nav ── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 40;
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      background: none; border: none; color: var(--muted);
      cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color .15s;
    }
    .nav-btn.active { color: var(--text); }
    .nav-icon  { font-size: 20px; line-height: 1; }
    .nav-label { font-size: 10px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; }

    /* ── Shared Header ── */
    .view-header {
      position: sticky; top: 0; z-index: 10;
      background: var(--bg);
      padding: 20px 16px 0;
      border-bottom: 1px solid var(--border);
    }
    .view-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 32px;
      letter-spacing: 1px; line-height: 1; margin-bottom: 16px;
    }

    /* ── Filter Tabs ── */
    .filter-tabs { display: flex; gap: 8px; padding-bottom: 12px; overflow-x: auto; scrollbar-width: none; }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .filter-tab {
      flex-shrink: 0; padding: 6px 16px; border-radius: 20px;
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all .15s; -webkit-tap-highlight-color: transparent;
    }
    .filter-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }

    /* ── Übungsliste ── */
    .list { padding: 12px 16px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .empty-state { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px; line-height: 1.6; grid-column: 1 / -1; }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .loading { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 14px; display: none; }
    .loading.active { display: block; }

    /* ── Übungs-Karte ── */
    .exercise-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; display: flex; gap: 8px; padding: 10px;
      cursor: pointer; transition: border-color .15s; -webkit-tap-highlight-color: transparent;
    }
    .exercise-card:active { border-color: var(--muted); }
    .card-thumb {
      width: 52px; height: 52px; border-radius: 8px; background: var(--border);
      flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-placeholder { color: var(--muted); font-size: 22px; }
    .card-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
    .card-top { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .card-name { font-weight: 600; font-size: 12px; line-height: 1.2; }
    .week-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; letter-spacing: .6px; text-transform: uppercase; }
    .badge-a  { background: rgba(200,169,110,.15); color: var(--kraft); }
    .badge-b  { background: rgba(93,170,176,.15);  color: var(--hyper); }
    .badge-ab { background: rgba(155,138,180,.15); color: var(--vol); }
    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); }
    .pill-kraft { border-color: rgba(200,169,110,.4); color: var(--kraft); }
    .pill-hyper { border-color: rgba(93,170,176,.4);  color: var(--hyper); }
    .pill-vol   { border-color: rgba(155,138,180,.4); color: var(--vol); }
    .pill-flexibility { border-color: rgba(123,168,196,.4); color: var(--flex); }
    .cat-header { padding: 14px 4px 4px; font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 2px; color: var(--muted); grid-column: 1 / -1; }

    /* ── FAB ── */
    .fab {
      position: fixed; bottom: calc(var(--nav-h) + 16px); right: 20px;
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--text); color: var(--bg); border: none; font-size: 28px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.5); z-index: 20;
      -webkit-tap-highlight-color: transparent; transition: transform .15s;
    }
    .fab:active { transform: scale(.93); }

    /* ── Modal ── */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 50; display: none; align-items: flex-end; }
    .overlay.open { display: flex; }
    .modal {
      background: var(--surface); border-radius: 20px 20px 0 0;
      border-top: 1px solid var(--border); width: 100%;
      max-height: 92vh; overflow-y: auto; padding: 24px 16px 44px;
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px; }
    .btn-close {
      background: var(--border); border: none; color: var(--text);
      width: 32px; height: 32px; border-radius: 50%; font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Formular ── */
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .form-input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 13px 14px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 16px; outline: none; transition: border-color .15s;
    }
    .form-input:focus { border-color: var(--muted); }
    .upload-area { border: 1px dashed var(--border); border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; position: relative; transition: border-color .15s; }
    .upload-area:hover { border-color: var(--muted); }
    .upload-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    #gif-preview { width: 100%; max-height: 160px; object-fit: contain; border-radius: 8px; display: none; }
    .upload-hint { color: var(--muted); font-size: 14px; }
    .upload-hint .upload-icon { font-size: 30px; margin-bottom: 6px; }
    .tag-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .t-toggle {
      padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--muted);
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all .15s; -webkit-tap-highlight-color: transparent;
    }
    .t-toggle.on { background: var(--border); color: var(--text); border-color: var(--muted); }
    .t-toggle[data-dup="kraft"].on       { background: rgba(200,169,110,.15); border-color: var(--kraft); color: var(--kraft); }
    .t-toggle[data-dup="hyper"].on       { background: rgba(93,170,176,.15);  border-color: var(--hyper); color: var(--hyper); }
    .t-toggle[data-dup="vol"].on         { background: rgba(155,138,180,.15); border-color: var(--vol);   color: var(--vol);   }
    .t-toggle[data-dup="flexibility"].on { background: rgba(123,168,196,.15); border-color: var(--flex);  color: var(--flex);  }
    .btn-primary {
      width: 100%; padding: 16px; background: var(--text); color: var(--bg); border: none;
      border-radius: 12px; font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px;
      cursor: pointer; margin-top: 8px; -webkit-tap-highlight-color: transparent; transition: opacity .15s;
    }
    .btn-primary:active { opacity: .8; }
    .btn-primary:disabled { opacity: .4; cursor: default; }
    .btn-danger {
      width: 100%; padding: 14px; background: transparent; color: #e05555;
      border: 1px solid rgba(224,85,85,.3); border-radius: 12px;
      font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500;
      cursor: pointer; margin-top: 10px; -webkit-tap-highlight-color: transparent;
    }
    .btn-danger:active { background: rgba(224,85,85,.1); }

    .ses-sets-input { width: 38px; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 2px 0; text-align: center; font-size: 12px; }
    .ta-weight-hint { color: var(--text); font-size: 12px; text-align: center; padding: 0 16px 4px; }
    .satz-progress { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; color: var(--kraft); }

    /* ── Wochenplan ── */
    .plan-week-switch { display: flex; gap: 8px; padding-bottom: 12px; }
    .plan-week-btn {
      flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--border);
      background: transparent; color: var(--muted);
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px;
      cursor: pointer; text-align: center; transition: all .15s; -webkit-tap-highlight-color: transparent;
    }
    .plan-week-btn[data-week="A"].active { background: rgba(200,169,110,.15); border-color: var(--kraft); color: var(--kraft); }
    .plan-week-btn[data-week="B"].active { background: rgba(93,170,176,.15);  border-color: var(--hyper); color: var(--hyper); }
    .plan-week-btn[data-week="B"].hidden { display: none; }
    .plan-toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 0 14px; border-bottom: 1px solid var(--border); margin-bottom: 4px;
    }
    .plan-toggle-label { font-size: 13px; color: var(--muted); }
    .toggle-switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0; background: var(--border); border-radius: 24px;
      cursor: pointer; transition: background .2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute; left: 3px; top: 3px;
      width: 18px; height: 18px; background: var(--muted); border-radius: 50%;
      transition: transform .2s, background .2s;
    }
    .toggle-switch input:checked + .toggle-slider { background: rgba(93,170,176,.25); border: 1px solid var(--hyper); }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); background: var(--hyper); }
    .plan-body { padding: 16px 16px 120px; }

    /* ── Sessions im Plan ── */
    .plan-day { margin-bottom: 20px; }
    .plan-day-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 0 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
    }
    .plan-day-label { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px; color: var(--muted); }
    .plan-day-add {
      background: none; border: 1px solid var(--border); border-radius: 50%;
      width: 24px; height: 24px; color: var(--text); font-size: 18px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; -webkit-tap-highlight-color: transparent; flex-shrink: 0;
    }
    .plan-day-add:active { background: var(--border); }
    .plan-day-empty { color: var(--muted); font-size: 12px; padding: 4px 0 6px; }
    .session-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 6px;
      cursor: pointer; -webkit-tap-highlight-color: transparent; transition: border-color .15s;
    }
    .session-card:active { border-color: var(--muted); }
    .session-info { flex: 1; min-width: 0; }
    .session-title { font-size: 14px; font-weight: 600; line-height: 1.2; }
    .session-meta  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .session-mode-badge {
      font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px;
      letter-spacing: .5px; text-transform: uppercase; flex-shrink: 0;
    }
    .mode-kraft       { background: rgba(200,169,110,.15); color: var(--kraft); }
    .mode-hyper       { background: rgba(93,170,176,.15);  color: var(--hyper); }
    .mode-vol         { background: rgba(155,138,180,.15); color: var(--vol);   }
    .mode-flexibility { background: rgba(123,168,196,.15); color: var(--flex);  }
    .session-start-btn {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); padding: 5px 10px; font-size: 11px; font-weight: 700;
      letter-spacing: .5px; cursor: pointer; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent; transition: background .15s;
    }
    .session-start-btn:active { background: var(--border); }

    /* ── Plan Detail / Session-Detailansicht ── */
    #plan-timer-sub { height: 100%; overflow: hidden; }
    .plan-detail-nav { display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
    .plan-back-btn { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; padding: 0; -webkit-tap-highlight-color: transparent; flex-shrink: 0; width: 28px; }
    .plan-detail-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; flex: 1; }
    .plan-detail-meta { font-size: 12px; color: var(--muted); padding-bottom: 12px; }
    .plan-detail-body { padding: 12px 16px 90px; }
    .plan-detail-footer { position: fixed; bottom: var(--nav-h); left: 0; right: 0; padding: 10px 16px; background: var(--bg); border-top: 1px solid var(--border); z-index: 5; }
    .det-ex-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .det-ex-row:last-child { border-bottom: none; }
    .det-ex-skipped { opacity: .4; }
    .det-ex-check {
      width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--muted);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: 13px; cursor: pointer; transition: all .15s; -webkit-tap-highlight-color: transparent;
    }
    .det-ex-check.on { background: var(--text); border-color: var(--text); color: var(--bg); }
    .det-ex-info { flex: 1; min-width: 0; }
    .det-ex-name { font-size: 14px; font-weight: 600; line-height: 1.2; }
    .det-ex-sub  { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .det-ex-stepper { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .det-step-btn {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      width: 26px; height: 26px; color: var(--text); font-size: 16px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .det-step-val { font-size: 14px; font-weight: 600; min-width: 18px; text-align: center; }
    .plan-start-row { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .plan-start-row:last-child { border-bottom: none; }
    .plan-start-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .plan-start-weights { font-size: 12px; color: var(--muted); line-height: 1.5; }

    /* ── Bias ── */
    .bias-section { margin-top: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .bias-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; margin-bottom: 14px; }
    .bias-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .bias-label { width: 80px; font-size: 12px; font-weight: 500; color: var(--muted); flex-shrink: 0; }
    .bias-bar-track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .bias-bar-fill { height: 100%; border-radius: 3px; background: var(--text); transition: width .4s ease; }
    .bias-bar-fill.zero { background: var(--border); }
    .bias-count { width: 20px; text-align: right; font-size: 12px; font-weight: 600; color: var(--muted); flex-shrink: 0; }
    .bias-count.nonzero { color: var(--text); }
    .bias-balance { display: flex; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .balance-chip { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 11px; font-weight: 600; text-align: center; line-height: 1.4; }
    .balance-chip .balance-label { color: var(--muted); display: block; margin-bottom: 2px; }
    .balance-chip.balanced { border-color: rgba(93,170,176,.4); color: var(--hyper); }
    .balance-chip.warn     { border-color: rgba(200,169,110,.4); color: var(--kraft); }

    /* ── Session-Overlay Felder ── */
    .ses-pool-item {
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    }
    .ses-pool-item:first-child { border-radius: 8px 8px 0 0; }
    .ses-pool-item:last-child  { border-radius: 0 0 8px 8px; border-bottom: none; }
    .ses-pool-thumb { display: none; }
    .ses-pool-footer { flex: 1; display: flex; align-items: center; gap: 6px; padding: 0; }
    .ses-pool-name { font-size: 13px; font-weight: 500; flex: 1; line-height: 1.2; color: var(--text); }
    .ses-add-btn {
      background: none; border: 1px solid var(--border); border-radius: 50%;
      width: 22px; height: 22px; color: var(--text); font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; -webkit-tap-highlight-color: transparent;
    }
    .ses-sel-item { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--border); transition: opacity .15s; }
    .ses-sel-item.drag-over { border-top: 2px solid var(--hyper); }
    .ses-sel-item.dragging  { opacity: .35; }
    .ses-drag-handle { font-size: 15px; color: var(--muted); cursor: grab; padding: 0 2px; touch-action: none; flex-shrink: 0; user-select: none; }
    .ses-drag-handle:active { cursor: grabbing; }
    .ses-sel-name { flex: 1; font-size: 13px; font-weight: 500; }
    .ses-sel-btns { display: flex; gap: 4px; flex-shrink: 0; }
    .ses-remove-btn { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 0 2px; -webkit-tap-highlight-color: transparent; }
    #ses-exercise-pool { display: flex; flex-direction: column; margin-top: 8px; max-height: 360px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
    #ses-selected-list { margin-top: 8px; }

    /* ── Timer: Select ── */
    .sel-week-label {
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px;
      padding-bottom: 12px; display: block;
    }
    .sel-body { padding: 16px 16px 24px; }
    .sel-day-header {
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); padding: 12px 0 6px;
    }
    .sel-session-item {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px; margin-bottom: 8px; cursor: pointer;
      -webkit-tap-highlight-color: transparent; transition: border-color .15s;
    }
    .sel-session-item:active { border-color: var(--muted); }
    .sel-session-title { font-size: 14px; font-weight: 600; }
    .sel-session-meta  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .sel-info {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
    }
    .sel-info-mode { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; margin-bottom: 4px; }
    .sel-info-meta { font-size: 13px; color: var(--muted); }
    .sel-exercise-item {
      display: flex; align-items: center; gap: 12px; padding: 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      margin-bottom: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: border-color .15s;
    }
    .sel-exercise-item.on { border-color: var(--muted); }
    .sel-check {
      width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--muted);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px;
    }
    .sel-exercise-item.on .sel-check { background: var(--text); border-color: var(--text); color: var(--bg); }
    .sel-ex-name { font-size: 14px; font-weight: 500; }
    .sel-empty { text-align: center; color: var(--muted); padding: 32px 20px; font-size: 14px; line-height: 1.6; }
    .btn-back {
      width: 100%; padding: 12px; background: transparent; border: 1px solid var(--border);
      border-radius: 12px; color: var(--muted); font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 12px;
      -webkit-tap-highlight-color: transparent; transition: border-color .15s;
    }
    .btn-back:active { border-color: var(--muted); }

    /* ── Timer: Active ── */
    .ta-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
    }
    .ta-exit {
      background: var(--border); border: none; color: var(--text);
      width: 32px; height: 32px; border-radius: 50%; font-size: 14px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .ta-mode-label { font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 1px; color: var(--muted); }
    .ta-counter    { font-size: 13px; font-weight: 600; color: var(--muted); }
    #timer-active { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .ta-img { flex: 1 1 0; min-height: 0; width: 100%; background: var(--surface); overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .ta-img img { width: 100%; height: 100%; object-fit: cover; }
    .ta-img-ph  { font-size: 64px; color: var(--border); }
    .ta-bottom  { flex: 0 0 auto; }
    .ta-name {
      font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px;
      text-align: center; padding: 12px 16px 0; line-height: 1.1;
    }
    .ta-dots { display: flex; justify-content: center; gap: 8px; padding: 10px 0 4px; }
    .set-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); transition: background .2s; }
    .set-dot.done   { background: var(--muted); }
    .set-dot.active { background: var(--text); }

    /* Ring */
    .ta-ring-wrap { position: relative; width: 130px; height: 130px; margin: 10px auto 6px; cursor: pointer; }
    .ta-ring-svg  { width: 100%; height: 100%; }
    .ring-bg   { fill: none; stroke: var(--border); stroke-width: 7; }
    .ring-fill {
      fill: none; stroke: var(--text); stroke-width: 7; stroke-linecap: round;
      stroke-dasharray: 339.29; stroke-dashoffset: 0;
      transform: rotate(-90deg); transform-origin: center;
      transition: stroke-dashoffset .08s linear, stroke .3s;
    }
    @keyframes ring-pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .ring-fill.pulsing { animation: ring-pulse 1.8s ease-in-out infinite; }
    .ta-ring-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    }
    .ta-time  { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 2px; line-height: 1; }
    .ta-phase { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--muted); }
    .ta-pause-hint { font-size: 9px; color: var(--border); margin-top: 2px; }

    /* Timer buttons */
    .ta-btns { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; padding: 10px 16px 16px; }
    .ta-skip {
      padding: 14px; background: transparent; border: 1px solid var(--border); border-radius: 12px;
      color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
      cursor: pointer; -webkit-tap-highlight-color: transparent; transition: border-color .15s;
    }
    .ta-skip:active { border-color: var(--muted); }
    .ta-main {
      padding: 14px; background: var(--text); border: none; border-radius: 12px;
      color: var(--bg); font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px;
      cursor: pointer; -webkit-tap-highlight-color: transparent; transition: opacity .15s;
    }
    .ta-main:active { opacity: .8; }
    .ta-hidden { visibility: hidden; }

    /* Pause-Layout */
    #ta-work-layout  { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
    #ta-pause-layout { flex: 1; flex-direction: column; overflow: hidden; }
    .tap-prev-row  { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .tap-prev-thumb { width: 40px; height: 40px; border-radius: 6px; overflow: hidden; flex-shrink: 0; background: var(--border); display: flex; align-items: center; justify-content: center; }
    .tap-prev-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .tap-prev-lbl { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .5px; }
    .tap-next-img  { flex: 1; min-height: 0; width: 100%; background: var(--surface); overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .tap-next-img img { width: 100%; height: 100%; object-fit: cover; }
    .tap-next-name { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px; text-align: center; padding: 8px 16px 2px; flex-shrink: 0; }
    .tap-time-row  { text-align: center; padding: 6px 16px; flex-shrink: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .tap-time      { font-family: 'Bebas Neue', sans-serif; font-size: 48px; letter-spacing: 2px; line-height: 1; }
    .tap-phase-lbl { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--muted); }
    .tap-weights   { padding: 6px 16px; font-size: 12px; color: var(--muted); flex-shrink: 0; }
    .tap-w-label   { font-size: 11px; font-weight: 700; letter-spacing: .5px; margin-bottom: 4px; }
    .tap-btns      { padding: 8px 16px 16px; flex-shrink: 0; }

    /* Flexibility Controls */
    .ta-flex-controls { display: none; gap: 10px; padding: 10px 16px 16px; }
    .ta-flex-controls .ta-skip { flex: 1; }
    .ta-flex-controls .ta-main { flex: 2; }

    /* ── Timer: Done ── */
    .done-body {
      display: flex; flex-direction: column; align-items: center;
      padding: 60px 24px 40px; text-align: center;
    }
    .done-icon  { font-size: 60px; margin-bottom: 16px; }
    .done-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 1px; margin-bottom: 10px; }
    .done-meta  { color: var(--muted); font-size: 14px; line-height: 1.7; margin-bottom: 32px; }

    /* ── Stats ── */
    .stats-placeholder { text-align: center; color: var(--muted); padding: 80px 24px; font-size: 15px; }

    /* ── Session Übersicht (read-only) ── */
    .btn-edit-ses {
      padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .ses-ov-time { font-size: 12px; color: var(--muted); padding-bottom: 12px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
    .ses-ov-row { padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .ses-ov-row:last-child { border-bottom: none; }
    .ses-ov-row:active { opacity: .6; }
    .ses-ov-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
    .ses-ov-meta { font-size: 12px; color: var(--muted); }
    .ses-ex-back { background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; padding: 4px 0 14px; display: block; -webkit-tap-highlight-color: transparent; }
    .ses-ex-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
    .ses-pr-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 8px; }
    .ses-pr-row:last-child { border-bottom: none; }
    .ses-pr-eq { font-size: 13px; font-weight: 600; min-width: 72px; flex-shrink: 0; }
    .ses-pr-val { flex: 1; font-size: 13px; }
    .ses-pr-add { font-size: 12px; color: var(--muted); background: none; border: 1px dashed var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-family: 'DM Sans',sans-serif; -webkit-tap-highlight-color: transparent; }
    .ses-last-row { padding-top: 14px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); margin-top: 4px; }

    /* ── Übungsdetail ── */
    .det-pr-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
    .det-pr-badge { display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px 12px; font-size:13px; }
    .det-pr-name { font-weight:600; color:var(--muted); }
    .det-pr-val { font-weight:700; color:var(--text); }
    .det-pr-edit { background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:0 2px; line-height:1; -webkit-tap-highlight-color:transparent; }
    .det-pr-input { width:70px; }
    .det-pr-save { background:var(--border); border:none; color:var(--text); border-radius:6px; padding:3px 8px; font-size:12px; cursor:pointer; font-family:'DM Sans',sans-serif; }
    .det-more-btn { width:100%; padding:10px; background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:10px; font-family:'DM Sans',sans-serif; font-size:13px; cursor:pointer; margin-top:10px; -webkit-tap-highlight-color:transparent; }
    .det-group { margin-bottom:16px; }
    .det-group-header { font-size:12px; font-weight:700; color:var(--muted); margin-bottom:6px; }
    .det-table { width:100%; border-collapse:collapse; font-size:12px; }
    .det-table th { color:var(--muted); font-weight:600; text-align:left; padding:3px 4px; font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
    .det-table td { padding:5px 4px; border-top:1px solid var(--border); }
    .det-history-sep { border:none; border-top:1px solid var(--border); margin:16px 0 12px; }

    /* ── Set-Log Modal ── */
    .sl-eq-row { display: grid; grid-template-columns: 88px 1fr 36px; align-items: center; gap: 8px; margin-bottom: 8px; }
    .sl-eq-label { font-size: 12px; font-weight: 600; color: var(--muted); }
    .sl-pr-badge { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(200,169,110,.2); color: var(--kraft); display: none; text-align: center; }
    .sl-set-info { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .sl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .sl-rir-btns { display: flex; gap: 6px; }
    .sl-rir-btn {
      flex: 1; padding: 9px 0; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--muted);
      font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer;
      -webkit-tap-highlight-color: transparent; transition: all .15s;
    }
    .sl-rir-btn.on { background: var(--border); color: var(--text); border-color: var(--muted); }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: calc(var(--nav-h) + 12px); left: 50%; transform: translateX(-50%);
      background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 20px;
      font-size: 14px; font-weight: 500; z-index: 60; opacity: 0; pointer-events: none;
      white-space: nowrap; transition: opacity .2s;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<!-- ══ View 1: Übungsbibliothek ══ -->
<div id="library-view" class="view">
  <div class="view-header">
    <h1>Übungen</h1>
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="alle">Alle</button>
      <button class="filter-tab" data-filter="chest">Brust</button>
      <button class="filter-tab" data-filter="back">Rücken</button>
      <button class="filter-tab" data-filter="shoulders">Schultern</button>
      <button class="filter-tab" data-filter="arms">Arme</button>
      <button class="filter-tab" data-filter="legs">Beine</button>
      <button class="filter-tab" data-filter="core">Core</button>
      <button class="filter-tab" data-filter="mobility">Mobilität</button>
    </div>
  </div>
  <div class="loading active" id="loading">Lädt…</div>
  <div class="list" id="exercise-list"></div>
  <button class="fab" id="fab" aria-label="Übung hinzufügen">+</button>
</div>

<!-- ══ View 2: Wochenplan + Timer ══ -->
<div id="plan-view" class="view hidden">

  <!-- Sub: Wochenansicht -->
  <div id="plan-week-sub">
    <div class="view-header">
      <h1>Wochenplan</h1>
      <div class="plan-toggle-row">
        <span class="plan-toggle-label">Woche B aktivieren</span>
        <label class="toggle-switch">
          <input type="checkbox" id="week-b-toggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="plan-week-switch">
        <button class="plan-week-btn active" data-week="A">Woche A</button>
        <button class="plan-week-btn hidden" data-week="B">Woche B</button>
      </div>
    </div>
    <div class="plan-body" id="plan-content"></div>
  </div>

  <!-- Sub: Session-Detail -->
  <div id="plan-detail-sub" style="display:none">
    <div class="view-header">
      <div class="plan-detail-nav">
        <button class="plan-back-btn" id="plan-detail-back">←</button>
        <span class="plan-detail-title" id="plan-detail-title"></span>
        <button class="btn-edit-ses" id="plan-detail-edit">Edit</button>
      </div>
      <div class="plan-detail-meta" id="plan-detail-meta"></div>
    </div>
    <div class="plan-detail-body" id="plan-detail-body"></div>
    <div class="plan-detail-footer">
      <button class="btn-primary" id="plan-detail-start">Training starten</button>
    </div>
  </div>

  <!-- Sub: Pre-workout Gewichtsübersicht -->
  <div id="plan-start-sub" style="display:none">
    <div class="view-header">
      <div class="plan-detail-nav">
        <button class="plan-back-btn" id="plan-start-back">←</button>
        <span class="plan-detail-title" id="plan-start-title"></span>
      </div>
    </div>
    <div class="plan-detail-body" id="plan-start-body"></div>
    <div class="plan-detail-footer">
      <button class="btn-primary" id="plan-start-go">Training starten</button>
    </div>
  </div>

  <!-- Sub: Timer -->
  <div id="plan-timer-sub" style="display:none">

    <!-- Aktiver Timer -->
    <div id="timer-active" style="display:none">
      <div class="ta-header">
        <button class="ta-exit" id="ta-exit">←</button>
        <span class="ta-mode-label" id="ta-mode-label"></span>
        <span class="ta-counter" id="ta-counter">1 / 1</span>
      </div>
      <div id="ta-work-layout">
        <div class="ta-img" id="ta-img"></div>
        <div class="ta-bottom">
          <div class="ta-name" id="ta-name"></div>
          <div class="ta-dots" id="ta-dots"></div>
          <div class="ta-weight-hint" id="ta-weight-hint" style="display:none"></div>
          <div class="ta-ring-wrap" id="ta-ring-wrap">
            <svg class="ta-ring-svg" viewBox="0 0 120 120">
              <circle class="ring-bg"   cx="60" cy="60" r="54"/>
              <circle class="ring-fill" cx="60" cy="60" r="54" id="ring-fill"/>
            </svg>
            <div class="ta-ring-center">
              <div class="ta-time"  id="ta-time">—</div>
              <div class="ta-phase" id="ta-phase">AUSFÜHREN</div>
              <div class="ta-pause-hint" id="ta-pause-hint"></div>
            </div>
          </div>
          <div class="ta-flex-controls" id="ta-flex-controls">
            <button class="ta-skip" id="ta-flex-prev">← Zurück</button>
            <button class="ta-main" id="ta-flex-next">Weiter →</button>
          </div>
          <div class="ta-btns" id="ta-btns">
            <button class="ta-skip" id="ta-skip">Überspringen</button>
            <button class="ta-main" id="ta-main">SATZ FERTIG</button>
          </div>
        </div>
      </div>
      <div id="ta-pause-layout" style="display:none">
        <div class="tap-prev-row">
          <div class="tap-prev-thumb" id="tap-prev-thumb"></div>
          <span class="tap-prev-lbl" id="tap-prev-lbl"></span>
        </div>
        <div class="tap-next-img" id="tap-next-img"></div>
        <div class="tap-next-name" id="tap-next-name"></div>
        <div class="tap-time-row" id="tap-time-row">
          <div class="tap-time" id="tap-time">—</div>
          <div class="tap-phase-lbl">PAUSE</div>
        </div>
        <div class="tap-weights" id="tap-weights"></div>
        <div class="tap-btns" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <button class="ta-skip" id="ta-pause-log">Gewicht nachtragen</button>
          <button class="ta-skip" id="ta-pause-skip">Pause skip</button>
        </div>
      </div>
    </div>

    <!-- Training abgeschlossen -->
    <div id="timer-done" style="display:none">
      <div class="done-body">
        <div class="done-icon">🏆</div>
        <div class="done-title">Abgeschlossen</div>
        <div class="done-meta" id="done-meta"></div>
        <button class="btn-primary" id="btn-save-session">Speichern &amp; Beenden</button>
        <button class="btn-danger"  id="btn-discard">Verwerfen</button>
      </div>
    </div>

  </div><!-- /plan-timer-sub -->
</div>

<!-- ══ View 3: Stats ══ -->
<div id="stats-view" class="view hidden">
  <div class="view-header">
    <h1>Stats</h1>
  </div>
  <div class="stats-placeholder">Stats folgen später.</div>
</div>

<!-- ══ Modal: Übungsdetail ══ -->
<div class="overlay" id="detail-overlay">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="det-name"></span>
      <div style="display:flex;gap:8px;align-items:center">
        <button type="button" class="btn-edit-ses" id="det-btn-edit">Edit</button>
        <button type="button" class="btn-close" id="det-btn-close">✕</button>
      </div>
    </div>
    <!-- A: Gewichte -->
    <div id="det-pr-section"></div>
    <hr class="det-history-sep">
    <div class="form-group">
      <label class="form-label">Trainingshistorie</label>
      <select class="form-input" id="det-filter-select" style="margin-bottom:12px">
        <option value="alle">Alle Sätze</option>
      </select>
      <div id="det-history-body"></div>
      <button type="button" class="det-more-btn" id="det-load-more" style="display:none">Mehr laden</button>
    </div>
  </div>
</div>

<!-- ══ Modal: Set-Log ══ -->
<div class="overlay" id="setlog-overlay">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="sl-title">Satz protokollieren</span>
      <button type="button" class="btn-close" id="sl-close">✕</button>
    </div>
    <div class="sl-set-info" id="sl-set-info"></div>
    <div id="sl-eq-rows"></div>
    <div class="sl-grid">
      <div>
        <label class="form-label">Reps</label>
        <input class="form-input" type="number" id="sl-reps" min="1" max="99" placeholder="z.B. 8" inputmode="numeric">
      </div>
      <div>
        <label class="form-label">RIR (optional)</label>
        <div class="sl-rir-btns">
          <button type="button" class="sl-rir-btn" data-rir="0">0</button>
          <button type="button" class="sl-rir-btn" data-rir="1">1</button>
          <button type="button" class="sl-rir-btn" data-rir="2">2</button>
          <button type="button" class="sl-rir-btn" data-rir="3">3</button>
        </div>
      </div>
    </div>
    <button type="button" class="btn-primary" id="sl-confirm" style="margin-top:20px">Satz Fertig</button>
  </div>
</div>

<!-- ══ Modal: Übung erstellen / bearbeiten ══ -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="modal-title">Neue Übung</span>
      <button class="btn-close" id="btn-close">✕</button>
    </div>
    <form id="form" novalidate>
      <div class="form-group">
        <label class="form-label" for="inp-name">Name</label>
        <input class="form-input" type="text" id="inp-name" placeholder="z.B. Romanian Deadlift" autocomplete="off" required>
      </div>
      <div class="form-group">
        <label class="form-label">DUP-Modi</label>
        <div class="tag-group">
          <button type="button" class="t-toggle" data-dup="kraft">Kraft</button>
          <button type="button" class="t-toggle" data-dup="hyper">Hyper</button>
          <button type="button" class="t-toggle" data-dup="vol">Vol</button>
          <button type="button" class="t-toggle" data-dup="flexibility">Flexibility</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Körperregion</label>
        <div class="tag-group">
          <button type="button" class="t-toggle" data-region="chest">Brust</button>
          <button type="button" class="t-toggle" data-region="back">Rücken</button>
          <button type="button" class="t-toggle" data-region="shoulders">Schultern</button>
          <button type="button" class="t-toggle" data-region="arms">Arme</button>
          <button type="button" class="t-toggle" data-region="legs">Beine</button>
          <button type="button" class="t-toggle" data-region="core">Core</button>
          <button type="button" class="t-toggle" data-region="mobility">Mobilität</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Bewegungsmuster</label>
        <div class="tag-group">
          <button type="button" class="t-toggle" data-movement="horizontal_push">Horiz. Push</button>
          <button type="button" class="t-toggle" data-movement="vertical_push">Vert. Push</button>
          <button type="button" class="t-toggle" data-movement="horizontal_pull">Horiz. Pull</button>
          <button type="button" class="t-toggle" data-movement="vertical_pull">Vert. Pull</button>
          <button type="button" class="t-toggle" data-movement="hip_hinge">Hip Hinge</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const db = supabase.createClient(
    'https://qbmoclbzhixsfvkazjpd.supabase.co',
    'sb_publishable_diAOa1sPJmdVUXeoY_6lhw_1BHxExT3'
  );

  // ── Global state ──────────────────────────────────────
  let exercises      = [];
  let sessions       = [];
  let activeFilter   = 'alle';
  let editingId      = null;
  let editingEx      = null;
  let gifBase64      = null;
  let planWeek       = 'A';
  let appState       = { id: null, current_week: 'A', week_b_enabled: false };
  let editingSessionId = null;
  let sesSelectedIds   = [];
  let sesRegion        = 'alle';

  let detExercise  = null;
  let detAllLogs   = [];
  let detPREditing = null;
  let detFilterTot = 'alle';
  let detGroupPage = 0;

  let planDetailSes  = null;
  let detailExSkip   = new Set();
  let detailExSets   = {};
  let planDetailLogs = {};

  const DUP_CFG = {
    kraft:       { sets:4, workTime:0,  restTime:180, repTarget:null },
    hyper:       { sets:3, workTime:0,  restTime:90,  repTarget:10  },
    vol:         { sets:3, workTime:40, restTime:60,  repTarget:null },
    flexibility: { sets:1, workTime:0,  restTime:0,   repTarget:null },
  };
  const DAYS       = ['mo','di','mi','do','fr','sa','so'];
  const DAY_LABELS = { mo:'Montag', di:'Dienstag', mi:'Mittwoch', do:'Donnerstag', fr:'Freitag', sa:'Samstag', so:'Sonntag' };
  const CIRC = 2 * Math.PI * 54;

  const MOVEMENT_PATTERNS = [
    'horizontal_push','vertical_push','horizontal_pull','vertical_pull',
    'hip_hinge','squat','lunge','carry','rotation','anti_rotation','core_flexion','isometrie','mobility'
  ];

  // ── DOM refs ──────────────────────────────────────────
  const listEl      = document.getElementById('exercise-list');
  const loadingEl   = document.getElementById('loading');
  const overlay     = document.getElementById('overlay');
  const modalTitle  = document.getElementById('modal-title');
  const form        = document.getElementById('form');
  const inpName     = document.getElementById('inp-name');
  const gifInput    = document.getElementById('gif-input');
  const gifPreview  = document.getElementById('gif-preview');
  const uploadHint  = document.getElementById('upload-hint');
  const btnDelete   = document.getElementById('btn-delete');
  const btnSave     = document.getElementById('btn-save');
  const planContent = document.getElementById('plan-content');
  const toastEl     = document.getElementById('toast');

  // ── Navigation ────────────────────────────────────────
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.view;
      document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
      document.getElementById(id)?.classList.remove('hidden');
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (id === 'plan-view')  { loadAppState().then(() => { applyWeekBState(); loadSessions().then(() => { showPlanSub('week'); renderPlan(); }); }); }
    });
  });

  // ═══════════════════════════════════════════════════════
  // MODUL 1 – Übungsbibliothek
  // ═══════════════════════════════════════════════════════
  const EX_META = 'id,name,dup_modes,body_regions,movement_patterns,muscle_groups_anatomical,strength_weights,week_assignment,created_at';

  async function load() {
    loadingEl.classList.add('active');
    const { data, error } = await db.from('exercises').select(EX_META).order('name');
    loadingEl.classList.remove('active');
    if (error) { toast('Fehler beim Laden'); return; }
    exercises = data || [];
    render();
  }

  // ── Detail-Modal (Gewichte + Historie) ───────────────
  const DET_EQ_TYPES  = ['barbell','dumbbell_1x','dumbbell_2x','kettlebell_1x','kettlebell_2x'];
  const DET_EQ_LABELS = { barbell:'Barbell', dumbbell_1x:'Dumbbell 1x', dumbbell_2x:'Dumbbell 2x', kettlebell_1x:'KB 1x', kettlebell_2x:'KB 2x' };
  const DET_WL_LABELS = { barbell:'BB', dumbbell_1x:'DB 1x', dumbbell_2x:'DB 2x', kettlebell_1x:'KB 1x', kettlebell_2x:'KB 2x' };
  const DET_MODE_LBL  = { kraft:'Kraft', hyper:'Hyper', vol:'Vol', flexibility:'Flex' };

  async function openDetailModal(ex) {
    detExercise  = ex;
    detAllLogs   = [];
    detFilterTot = 'alle';
    detGroupPage = 0;
    detPREditing = null;
    document.getElementById('det-name').textContent = ex.name;
    document.getElementById('det-pr-section').innerHTML = '';
    document.getElementById('det-history-body').innerHTML = '<div style="color:var(--muted);font-size:13px">Lädt…</div>';
    document.getElementById('det-load-more').style.display = 'none';
    document.getElementById('det-filter-select').innerHTML = '<option value="alle">Alle Sätze</option>';
    document.getElementById('detail-overlay').classList.add('open');
    const { data } = await db.from('set_log')
      .select('set_number,total_sets_in_session,weight_kg,reps,rir,equipment,session_date,session_id,sessions(dup_mode,weekday)')
      .eq('exercise_id', ex.id)
      .order('session_date', { ascending: false })
      .order('set_number');
    detAllLogs = data || [];
    renderDetPR();
    renderDetFilter();
    renderDetHistory();
  }

  function renderDetPR() {
    const el = document.getElementById('det-pr-section');
    const eqTypes = [...new Set(detAllLogs.map(r => r.equipment).filter(Boolean))];
    if (!eqTypes.length) { el.innerHTML = ''; return; }
    const weights = detExercise.strength_weights || [];
    el.innerHTML = '<div class="det-pr-row">' + eqTypes.map(eq => {
      const sw  = weights.find(w => w.type === eq);
      const pr  = sw?.personal_record ?? null;
      const max = Math.max(0, ...detAllLogs.filter(r => r.equipment === eq && r.weight_kg != null).map(r => r.weight_kg));
      const isManual = pr != null && max > 0 && pr > max;
      if (detPREditing === eq) {
        return `<div class="det-pr-badge">
          <span class="det-pr-name">${DET_WL_LABELS[eq]||eq} – PR:</span>
          <input class="form-input det-pr-input" type="number" step="0.5" inputmode="decimal" id="det-pr-inp-${eq}" value="${pr ?? ''}">
          <button type="button" class="det-pr-save" data-eq="${eq}">✓</button>
        </div>`;
      }
      return `<div class="det-pr-badge">
        <span class="det-pr-name">${DET_WL_LABELS[eq]||eq} – PR:</span>
        <span class="det-pr-val">${pr != null ? pr+' kg' : '—'}</span>
        ${isManual ? `<button type="button" class="det-pr-edit" data-eq="${eq}" title="Manuell gesetzt">✎</button>` : ''}
      </div>`;
    }).join('') + '</div>';
    el.querySelectorAll('.det-pr-edit').forEach(btn =>
      btn.addEventListener('click', () => { detPREditing = btn.dataset.eq; renderDetPR(); })
    );
    el.querySelectorAll('.det-pr-save').forEach(btn =>
      btn.addEventListener('click', () => savePROverride(btn.dataset.eq))
    );
  }

  async function savePROverride(eq) {
    const val = parseFloat(document.getElementById(`det-pr-inp-${eq}`)?.value);
    if (isNaN(val) || val <= 0) { detPREditing = null; renderDetPR(); return; }
    const weights = (detExercise.strength_weights || []).map(w => ({...w}));
    const entry   = weights.find(w => w.type === eq);
    if (entry) { entry.personal_record = val; }
    else       { weights.push({ type: eq, working_weight: null, personal_record: val }); }
    const { error } = await db.from('exercises').update({ strength_weights: weights }).eq('id', detExercise.id);
    if (error) { toast('Fehler beim Speichern'); return; }
    const local = exercises.find(e => e.id === detExercise.id);
    if (local) local.strength_weights = weights;
    detExercise.strength_weights = weights;
    detPREditing = null;
    renderDetPR();
    toast('PR gespeichert');
  }

  function renderDetFilter() {
    const totals = [...new Set(detAllLogs.map(r => r.total_sets_in_session).filter(Boolean))].sort((a,b) => a-b);
    const sel = document.getElementById('det-filter-select');
    sel.innerHTML = '<option value="alle">Alle Sätze</option>' +
      totals.map(n => `<option value="${n}">${n} ${n===1?'Satz':'Sätze'}</option>`).join('');
    sel.value = detFilterTot;
  }

  function getDetGroups() {
    const logs = detFilterTot === 'alle'
      ? detAllLogs
      : detAllLogs.filter(r => r.total_sets_in_session == detFilterTot);
    const map = new Map();
    logs.forEach(r => {
      const key = `${r.session_date}__${r.session_id||''}`;
      if (!map.has(key)) map.set(key, { date: r.session_date, ses: r.sessions, rows: [] });
      map.get(key).rows.push(r);
    });
    return [...map.values()];
  }

  function renderDetHistory() {
    const groups  = getDetGroups();
    const visible = groups.slice(0, (detGroupPage + 1) * 10);
    const histEl  = document.getElementById('det-history-body');
    if (!groups.length) {
      histEl.innerHTML = '<div style="color:var(--muted);font-size:13px">Keine Einträge.</div>';
      document.getElementById('det-load-more').style.display = 'none';
      return;
    }
    histEl.innerHTML = visible.map(g => {
      const [y,m,d] = g.date.split('-');
      const modeStr = g.ses ? ` – ${DET_MODE_LBL[g.ses.dup_mode]||g.ses.dup_mode}` : '';
      const dayStr  = g.ses?.weekday ? ` – ${g.ses.weekday}` : '';
      const trs = g.rows.map(r => `<tr>
        <td>${r.set_number}</td>
        <td>${r.reps ?? '—'}</td>
        <td>${r.weight_kg != null ? r.weight_kg+' kg' : '—'}</td>
        <td>${r.equipment ? (DET_WL_LABELS[r.equipment]||r.equipment) : '—'}</td>
        <td>${r.rir ?? '—'}</td>
      </tr>`).join('');
      return `<div class="det-group">
        <div class="det-group-header">${d}.${m}.${y}${modeStr}${dayStr}</div>
        <table class="det-table">
          <thead><tr><th>Satz</th><th>Reps</th><th>Gewicht</th><th>Equip.</th><th>RIR</th></tr></thead>
          <tbody>${trs}</tbody>
        </table>
      </div>`;
    }).join('');
    document.getElementById('det-load-more').style.display = groups.length > visible.length ? 'block' : 'none';
  }

  document.getElementById('det-btn-close').addEventListener('click', () =>
    document.getElementById('detail-overlay').classList.remove('open'));
  document.getElementById('detail-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('detail-overlay'))
      document.getElementById('detail-overlay').classList.remove('open');
  });
  document.getElementById('det-btn-edit').addEventListener('click', () => {
    document.getElementById('detail-overlay').classList.remove('open');
    openModal(detExercise);
  });
  document.getElementById('det-filter-select').addEventListener('change', e => {
    detFilterTot = e.target.value; detGroupPage = 0; renderDetHistory();
  });
  document.getElementById('det-load-more').addEventListener('click', () => {
    detGroupPage++; renderDetHistory();
  });

  async function savExercise() {
    btnSave.disabled = true;
    const payload = buildPayload();
    let error;
    if (editingId) {
      ({ error } = await db.from('exercises').update(payload).eq('id', editingId));
    } else {
      ({ error } = await db.from('exercises').insert([payload]));
    }
    btnSave.disabled = false;
    if (error) { toast('Fehler: ' + (error.message || error.code || 'Unbekannt')); return; }
    closeModal();
    toast(editingId ? 'Gespeichert' : 'Übung hinzugefügt');
    await load();
  }

  async function removeExercise() {
    if (!editingId) return;
    const { error } = await db.from('exercises').delete().eq('id', editingId);
    if (error) { toast('Fehler beim Löschen'); return; }
    closeModal();
    toast('Gelöscht');
    await load();
  }

  function buildPayload() {
    return {
      name:                    inpName.value.trim(),
      gif_base64:              gifBase64,
      dup_modes:               [...document.querySelectorAll('.t-toggle[data-dup].on')].map(b => b.dataset.dup),
      body_regions:            [...document.querySelectorAll('.t-toggle[data-region].on')].map(b => b.dataset.region),
      movement_patterns:       [...document.querySelectorAll('.t-toggle[data-movement].on')].map(b => b.dataset.movement),
      muscle_groups_anatomical:[...document.querySelectorAll('.t-toggle[data-anatomical].on')].map(b => b.dataset.anatomical),
    };
  }

  // ── Library grouping ──────────────────────────────────
  const CATS = [
    { key:'komplex', label:'Komplex',    test: e => (e.body_regions||[]).length > 1 },
    { key:'upper',   label:'Upper Body', test: e => { const r=e.body_regions||[]; return r.length===1 && ['chest','back','shoulders','arms'].includes(r[0]); }},
    { key:'lower',   label:'Lower Body', test: e => { const r=e.body_regions||[]; return r.length===1 && r[0]==='legs'; }},
    { key:'core',    label:'Core',       test: e => { const r=e.body_regions||[]; return r.length===1 && r[0]==='core'; }},
    { key:'flex',    label:'Flexibility',test: e => { const r=e.body_regions||[]; return r.length===1 && r[0]==='mobility'; }},
  ];

  function weekBadgeHTML(ex) {
    const wa = ex.week_assignment || [];
    const hasA = wa.includes('A'), hasB = wa.includes('B');
    if (hasA && hasB) return `<span class="week-badge badge-ab">A+B</span>`;
    if (hasA) return `<span class="week-badge badge-a">A</span>`;
    if (hasB) return `<span class="week-badge badge-b">B</span>`;
    return '';
  }

  function renderExCard(e) {
    const dp = (e.dup_modes||[]).map(m=>`<span class="pill pill-${m}">${cap(m)}</span>`).join('');
    const th = e.gif_base64 ? `<img src="${e.gif_base64}" loading="lazy">` : `<span class="thumb-placeholder">💪</span>`;
    return `<div class="exercise-card" data-id="${e.id}"><div class="card-thumb">${th}</div><div class="card-content"><div class="card-top"><span class="card-name">${e.name}</span>${weekBadgeHTML(e)}</div><div class="card-tags">${dp}</div></div></div>`;
  }

  function render() {
    let html = '';
    if (activeFilter === 'alle') {
      const seen = new Set();
      CATS.forEach(cat => {
        const group = exercises.filter(cat.test);
        if (!group.length) return;
        html += `<div class="cat-header">${cat.label}</div>`;
        html += group.map(e => { seen.add(e.id); return renderExCard(e); }).join('');
      });
      const rest = exercises.filter(e => !seen.has(e.id));
      if (rest.length) {
        html += `<div class="cat-header">Andere</div>`;
        html += rest.map(renderExCard).join('');
      }
    } else {
      const group = exercises.filter(e => (e.body_regions||[]).includes(activeFilter));
      html = group.map(renderExCard).join('');
    }
    if (!html) {
      html = `<div class="empty-state"><div class="icon">📭</div>${exercises.length===0 ? 'Noch keine Übungen.<br>Tippe auf + um zu beginnen.' : 'Keine Übungen in dieser Kategorie.'}</div>`;
    }
    listEl.innerHTML = html;
    listEl.querySelectorAll('.exercise-card').forEach(c =>
      c.addEventListener('click', () => openDetailModal(exercises.find(e => e.id === c.dataset.id))));
  }

  }

  function applyWeekBState() {

  async function loadSessions() {
    const { data } = await db.from('sessions').select('*').order('created_at');
    sessions = data || [];
  }

  function renderPlan() {
    const ws = sessions.filter(s => s.week === planWeek);
    let html = '';
    DAYS.forEach(day => {
      const daySessions = ws.filter(s => s.weekday === day);
      html += `<div class="plan-day"><div class="plan-day-header">
        <span class="plan-day-label">${DAY_LABELS[day]}</span>
        <button class="plan-day-add" data-day="${day}">+</button>
      </div>`;
      if (daySessions.length) {
        html += daySessions.map(s => {
          const exCount = (s.exercise_ids||[]).length;
          const timeStr = s.dup_mode === 'flexibility' ? ''
            : (s.dup_mode === 'kraft' || s.dup_mode === 'hyper') ? ` · Pause: ${s.rest_seconds||'?'}s`
            : ` · ${s.work_seconds||'?'}s AMRAP / ${s.rest_seconds||'?'}s`;
          return `<div class="session-card" data-id="${s.id}">
            <div class="session-info">
              <div class="session-title">${s.title || cap(s.dup_mode)}</div>
              <div class="session-meta">${exCount} Übungen${timeStr}</div>
            </div>
            <span class="session-mode-badge mode-${s.dup_mode}">${cap(s.dup_mode)}</span>
            <button type="button" class="session-start-btn" data-id="${s.id}">▶</button>
          </div>`;
        }).join('');
      } else {
        html += `<div class="plan-day-empty">Keine Sessions</div>`;
      }
      html += `</div>`;
    });

    const allExIds = new Set(ws.filter(s=>s.dup_mode!=='flexibility').flatMap(s=>(s.exercise_ids||[]).map(c=>typeof c==='string'?c:c.exercise_id)));
    const wex = exercises.filter(e => allExIds.has(e.id));
    html += buildBiasHTML(wex);

    planContent.innerHTML = html;
    planContent.querySelectorAll('.plan-day-add').forEach(btn =>
      btn.addEventListener('click', () => openSessionModal(null, btn.dataset.day)));
    planContent.querySelectorAll('.session-card').forEach(card => {
      card.addEventListener('click', () => openPlanDetail(sessions.find(s => s.id === card.dataset.id)));
      card.querySelector('.session-start-btn')?.addEventListener('click', e => {
        e.stopPropagation();
        startTrainingDirect(sessions.find(s => s.id === card.dataset.id));
      });
    });
  }

  function buildBiasHTML(wex) {
    const counts = Object.fromEntries(MOVEMENT_PATTERNS.map(m => [m, 0]));
    wex.forEach(e => (e.movement_patterns||[]).forEach(m => { if (m in counts) counts[m]++; }));
    const max = Math.max(...Object.values(counts), 1);
    const bars = MOVEMENT_PATTERNS.map(m => {
      const c = counts[m], pct = Math.round(c/max*100);
      const label = m.replace(/_/g,' ');
      return `<div class="bias-row"><span class="bias-label">${label}</span><div class="bias-bar-track"><div class="bias-bar-fill${c===0?' zero':''}" style="width:${pct}%"></div></div><span class="bias-count${c>0?' nonzero':''}">${c}</span></div>`;
    }).join('');
    const hp = counts.horizontal_push, hpl = counts.horizontal_pull, vpl = counts.vertical_pull;
    const sq = counts.squat, hi = counts.hip_hinge;
    const pushTotal = hp + (counts.vertical_push||0);
    const pullTotal = hpl + vpl;
    return `<div class="bias-section"><div class="bias-title">Muskel-Bias</div>${bars}<div class="bias-balance">${balanceChip('Push/Pull',pushTotal,pullTotal)}${balanceChip('Squat/Hinge',sq,hi)}</div></div>`;
  }

  function balanceChip(label, a, b) {
    const d = Math.abs(a-b), cls = d===0?'balanced':'warn', s = d===0?'✓ Ausgeglichen':`± ${d}`;
    return `<div class="balance-chip ${cls}"><span class="balance-label">${label}</span>${s}</div>`;
  }

  document.querySelectorAll('.plan-week-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.plan-week-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); planWeek = btn.dataset.week; renderPlan();
  }));

    document.getElementById('plan-detail-sub').style.display  = sub === 'detail' ? '' : 'none';

    document.getElementById('plan-timer-sub').style.display   = sub === 'timer'  ? '' : 'none';

  // ── Plan: Session-Detailansicht ───────────────────────
  async function openPlanDetail(ses) {
    if (!ses) return;
    planDetailSes  = ses;
    detailExSkip   = new Set();
    detailExSets   = {};
    planDetailLogs = {};
    (ses.exercise_ids||[]).forEach(cfg => {
      const id   = typeof cfg === 'string' ? cfg : cfg.exercise_id;
      const sets = typeof cfg === 'object' ? (cfg.sets||3) : 3;
      detailExSets[id] = sets;
    });
    document.getElementById('plan-detail-title').textContent = ses.title || cap(ses.dup_mode);
    const isFlex = ses.dup_mode === 'flexibility';
    const meta   = isFlex ? 'Flexibility'
      : (ses.dup_mode === 'kraft' || ses.dup_mode === 'hyper') ? `Pause: ${ses.rest_seconds}s`
      : `${ses.work_seconds||'?'}s AMRAP · ${ses.rest_seconds}s Pause`;
    document.getElementById('plan-detail-meta').textContent = meta;
    document.getElementById('plan-detail-body').innerHTML   = '<div style="color:var(--muted);font-size:13px;padding:8px 0">Lädt…</div>';
    showPlanSub('detail');
    const exIds = (ses.exercise_ids||[]).map(cfg => typeof cfg === 'string' ? cfg : cfg.exercise_id);
    if (exIds.length) {
      const { data } = await db.from('set_log')
        .select('exercise_id,weight_kg,equipment,total_sets_in_session,set_number,session_date')
        .in('exercise_id', exIds)
        .order('session_date', { ascending: false });
      (data||[]).forEach(row => {
        if (!planDetailLogs[row.exercise_id]) planDetailLogs[row.exercise_id] = [];
        planDetailLogs[row.exercise_id].push(row);
      });
    }
    renderDetailBody();
  }

  function renderDetailBody() {
    const ses    = planDetailSes;
    const isFlex = ses.dup_mode === 'flexibility';
    const items  = (ses.exercise_ids||[]).map(cfg => ({
      exercise_id: typeof cfg === 'string' ? cfg : cfg.exercise_id,
      sets:        typeof cfg === 'object' ? (cfg.sets||3) : 3,
    }));
    const el = document.getElementById('plan-detail-body');
    if (!items.length) { el.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px 0">Keine Übungen.</div>'; return; }
    el.innerHTML = items.map(item => {
      const ex      = exercises.find(e => e.id === item.exercise_id);
      if (!ex) return '';
      const skipped = detailExSkip.has(item.exercise_id);
      const curSets = detailExSets[item.exercise_id] ?? item.sets ?? 3;
      const logs    = planDetailLogs[item.exercise_id] || [];
      const sw      = ex.strength_weights || [];
      const pr      = [...new Set(logs.map(r => r.equipment).filter(Boolean))]
        .map(eq => sw.find(w => w.type === eq)?.personal_record)
        .find(v => v != null);
      const setStrs = isFlex ? [] : Array.from({length: curSets}, (_, i) => {
        const n   = i + 1;
        const log = logs.find(r => r.set_number === n && r.total_sets_in_session === curSets && r.weight_kg != null);
        return log ? `S${n}: ${log.weight_kg}kg` : `S${n}: —`;
      });
      const sub = [...setStrs, pr != null ? `PR: ${pr}kg` : ''].filter(Boolean).join(' · ');
      return `<div class="det-ex-row${skipped?' det-ex-skipped':''}">
        <div class="det-ex-check${skipped?'':' on'}" data-id="${item.exercise_id}">${skipped?'':'✓'}</div>
        <div class="det-ex-info">
          <div class="det-ex-name">${ex.name}</div>
          ${sub ? `<div class="det-ex-sub">${sub}</div>` : ''}
        </div>
        ${isFlex ? '' : `<div class="det-ex-stepper">
          <button type="button" class="det-step-btn" data-id="${item.exercise_id}" data-act="minus">−</button>
          <span class="det-step-val">${curSets}</span>
          <button type="button" class="det-step-btn" data-id="${item.exercise_id}" data-act="plus">+</button>
        </div>`}
      </div>`;
    }).join('');
    el.querySelectorAll('.det-ex-check').forEach(chk =>
      chk.addEventListener('click', () => {
        const id = chk.dataset.id;
        if (detailExSkip.has(id)) detailExSkip.delete(id); else detailExSkip.add(id);
        renderDetailBody();
      })
    );
    el.querySelectorAll('.det-step-btn').forEach(btn =>
      btn.addEventListener('click', () => {
        const id  = btn.dataset.id;
        const cur = detailExSets[id] ?? 3;
        detailExSets[id] = btn.dataset.act === 'plus' ? Math.min(10, cur+1) : Math.max(1, cur-1);
        renderDetailBody();
      })
    );
  }

  document.getElementById('plan-detail-back')?.addEventListener('click', () => showPlanSub('week'));
  document.getElementById('plan-detail-edit')?.addEventListener('click', () => {

  function renderPreWorkoutBody() {

    const isFlex = ses.dup_mode === 'flexibility';
    const items  = (ses.exercise_ids||[])
      .map(cfg => ({ exercise_id: typeof cfg==='string'?cfg:cfg.exercise_id, sets: typeof cfg==='object'?(cfg.sets||3):3 }))

      if (!ex) return '';
      const curSets = detailExSets[item.exercise_id] ?? item.sets ?? 3;
      const logs    = planDetailLogs[item.exercise_id] || [];
      const setStrs = isFlex ? [] : Array.from({length: curSets}, (_, i) => {
        const n   = i + 1;
        const log = logs.find(r => r.set_number === n && r.total_sets_in_session === curSets && r.weight_kg != null);
        return log ? `S${n}: ${log.weight_kg}kg` : `S${n}: —`;
      });
      return `<div class="plan-start-row">
        <div class="plan-start-name">${ex.name}</div>

  document.getElementById('plan-start-back')?.addEventListener('click', () => {

  document.getElementById('plan-start-go')?.addEventListener('click', launchTimer);

  // ── Session Modal ──────────────────────────────────────
  const SW_LABELS = { barbell:'BB', dumbbell_1x:'DB 1x', dumbbell_2x:'DB 2x', kettlebell_1x:'KB 1x', kettlebell_2x:'KB 2x' };

  function enterSesEditMode() {
    document.getElementById('session-modal-title').textContent = editingSessionId ? 'Session bearbeiten' : 'Neue Session';
    document.getElementById('session-form').style.display      = 'block';
    document.getElementById('ses-btn-delete').style.display    = editingSessionId ? 'block' : 'none';
  }

  function openSessionModal(ses = null, preDay = null) {
    editingSessionId = ses?.id ?? null;
    document.getElementById('ses-btn-delete').style.display = ses ? 'block' : 'none';
    document.querySelectorAll('.t-toggle[data-weekday]').forEach(b => b.classList.remove('on'));
    document.querySelectorAll('.t-toggle[data-sesmode]').forEach(b => b.classList.remove('on'));
    const day = ses?.weekday || preDay;
    if (day) document.querySelector(`.t-toggle[data-weekday="${day}"]`)?.classList.add('on');
    const mode = ses?.dup_mode || 'hyper';
    document.querySelector(`.t-toggle[data-sesmode="${mode}"]`)?.classList.add('on');
    document.getElementById('ses-work').value       = (ses?.dup_mode === 'vol'   ? ses?.work_seconds : '') ?? '';
    document.getElementById('ses-rep-target').value = '';
    document.getElementById('ses-rest').value       = ses?.rest_seconds ?? '';
    document.getElementById('ses-title').value = ses?.title ?? '';
    sesSelectedIds = (ses?.exercise_ids || []).map(cfg =>
      typeof cfg === 'string' ? { exercise_id: cfg, sets: 3 } : { exercise_id: cfg.exercise_id, sets: cfg.sets || 3 }
    );
    document.getElementById('ses-search').value = '';
    sesRegion = 'alle';
    document.querySelectorAll('#ses-region-tabs .filter-tab').forEach(b => b.classList.toggle('active', b.dataset.region === 'alle'));
    updateSesModeUI();
    renderSesPool('');
    renderSesSelected();
    enterSesEditMode();
    document.getElementById('session-overlay').classList.add('open');
  }

  function updateSesModeUI() {
    const mode = document.querySelector('.t-toggle[data-sesmode].on')?.dataset.sesmode;
    const isFlex  = mode === 'flexibility';
    const isHyper = mode === 'hyper';
    const isVol   = mode === 'vol';
    document.getElementById('ses-timer-section').style.display  = isFlex ? 'none' : 'block';
    document.getElementById('ses-work-section').style.display   = isVol   ? 'block' : 'none';
    if (!isFlex && mode) {
      const rEl = document.getElementById('ses-rest');
      if (!rEl.value) rEl.value = { kraft:180, hyper:90, vol:60 }[mode] || 60;
      if (isVol) { const wEl = document.getElementById('ses-work'); if (!wEl.value) wEl.value = 40; }
    }
    autoFillSesTitle();
  }

  function renderSesPool(search) {
    const term = search.toLowerCase();
    const filtered = exercises.filter(e =>
      !sesSelectedIds.some(s => s.exercise_id === e.id) &&
      (sesRegion === 'alle' || (e.body_regions||[]).includes(sesRegion)) &&
      (term === '' || e.name.toLowerCase().includes(term))
    );
    const poolEl = document.getElementById('ses-exercise-pool');
    if (!filtered.length) {
      poolEl.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:8px 0;grid-column:1/-1">Keine Treffer.</div>`;
    } else {
      poolEl.innerHTML = filtered.map(e => {
        const th = e.gif_base64
          ? `<img src="${e.gif_base64}" loading="lazy">`
          : `<span class="ses-pool-thumb-ph">💪</span>`;
        return `<div class="ses-pool-item" data-id="${e.id}">
          <div class="ses-pool-thumb">${th}</div>
          <div class="ses-pool-footer">
            <span class="ses-pool-name">${e.name}</span>
            <button type="button" class="ses-add-btn">+</button>
          </div>
        </div>`;
      }).join('');
    }
    document.querySelectorAll('.ses-pool-item .ses-add-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        sesSelectedIds.push({ exercise_id: btn.closest('.ses-pool-item').dataset.id, sets: 1 });
        renderSesPool(document.getElementById('ses-search').value);
        renderSesSelected();
        autoFillSesTitle();
      });
    });
  }

  function renderSesSelected() {
    const el = document.getElementById('ses-selected-list');
    if (!sesSelectedIds.length) { el.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:6px 0">Noch leer.</div>`; return; }
    el.innerHTML = sesSelectedIds.map((item, idx) => {
      const ex = exercises.find(e => e.id === item.exercise_id);
      if (!ex) return '';
      return `<div class="ses-sel-item" data-idx="${idx}" draggable="true">
        <span class="ses-drag-handle">⠿</span>
        <span class="ses-sel-name">${ex.name}</span>
        <input type="number" class="ses-sets-input" data-idx="${idx}" min="1" max="10" value="${item.sets||1}" title="Sätze">
        <div class="ses-sel-btns">
          <button type="button" class="ses-remove-btn" data-id="${item.exercise_id}">×</button>
        </div>
      </div>`;
    }).join('');
    el.querySelectorAll('.ses-sets-input').forEach(inp => {
      inp.addEventListener('change', () => {
        const i = parseInt(inp.dataset.idx);
        sesSelectedIds[i].sets = Math.min(10, Math.max(1, parseInt(inp.value) || 1));
        inp.value = sesSelectedIds[i].sets;
      });
    });
    el.querySelectorAll('.ses-remove-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        sesSelectedIds = sesSelectedIds.filter(i => i.exercise_id !== btn.dataset.id);
        renderSesPool(document.getElementById('ses-search').value);
        renderSesSelected();
        autoFillSesTitle();
      });
    });
    // ── Drag-and-drop (HTML5 + Touch) ──
    let dragIdx = null;
    el.querySelectorAll('.ses-sel-item').forEach(item => {
      item.addEventListener('dragstart', () => {
        dragIdx = parseInt(item.dataset.idx);
        setTimeout(() => item.classList.add('dragging'), 0);
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        el.querySelectorAll('.ses-sel-item').forEach(i => i.classList.remove('drag-over'));
      });
      item.addEventListener('dragover', e => {
        e.preventDefault();
        el.querySelectorAll('.ses-sel-item').forEach(i => i.classList.remove('drag-over'));
        item.classList.add('drag-over');
      });
      item.addEventListener('drop', e => {
        e.preventDefault();
        const dropIdx = parseInt(item.dataset.idx);
        item.classList.remove('drag-over');
        if (dragIdx !== null && dragIdx !== dropIdx) {
          const moved = sesSelectedIds.splice(dragIdx, 1)[0];
          sesSelectedIds.splice(dropIdx, 0, moved);
          renderSesSelected();
        }
      });
    });
    // Touch drag
    let touchIdx = null, touchClone = null;
    el.querySelectorAll('.ses-drag-handle').forEach(handle => {
      const row = handle.closest('.ses-sel-item');
      handle.addEventListener('touchstart', e => {
        touchIdx = parseInt(row.dataset.idx);
        const t = e.touches[0], rect = row.getBoundingClientRect();
        touchClone = row.cloneNode(true);
        Object.assign(touchClone.style, {
          position:'fixed', top:rect.top+'px', left:rect.left+'px',
          width:rect.width+'px', zIndex:'200', opacity:'.85',
          background:'var(--surface)', borderRadius:'8px', pointerEvents:'none',
          boxShadow:'0 4px 16px rgba(0,0,0,.5)', padding:'8px 0'
        });
        document.body.appendChild(touchClone);
        row.classList.add('dragging');
      }, { passive: true });
      handle.addEventListener('touchmove', e => {
        if (!touchClone) return;
        const t = e.touches[0];
        touchClone.style.top = (t.clientY - 24) + 'px';
        el.querySelectorAll('.ses-sel-item').forEach(i => i.classList.remove('drag-over'));
        const over = document.elementFromPoint(t.clientX, t.clientY)?.closest('.ses-sel-item');
        if (over && over !== row) over.classList.add('drag-over');
      }, { passive: true });
      handle.addEventListener('touchend', () => {
        if (touchClone) { document.body.removeChild(touchClone); touchClone = null; }
        row.classList.remove('dragging');
        const over = el.querySelector('.ses-sel-item.drag-over');
        if (over) {
          const dropIdx = parseInt(over.dataset.idx);
          over.classList.remove('drag-over');
          if (touchIdx !== null && touchIdx !== dropIdx) {
            const moved = sesSelectedIds.splice(touchIdx, 1)[0];
            sesSelectedIds.splice(dropIdx, 0, moved);
          }
        }
        touchIdx = null;
        renderSesSelected();
      });
    });
  }

  async function saveSession() {
    const weekday = document.querySelector('.t-toggle[data-weekday].on')?.dataset.weekday;
    const mode    = document.querySelector('.t-toggle[data-sesmode].on')?.dataset.sesmode;
    if (!weekday || !mode) { toast('Wochentag und Modus wählen'); return; }
    const isFlex = mode === 'flexibility';
    const payload = {
      week:         planWeek,
      weekday,
      dup_mode:     mode,
      exercise_ids: sesSelectedIds.map(s => ({ exercise_id: s.exercise_id, sets: s.sets || 3 })),
      work_seconds: (isFlex || mode === 'kraft' || mode === 'hyper') ? null
        : (parseInt(document.getElementById('ses-work').value) || null),
      rest_seconds: isFlex ? null : (parseInt(document.getElementById('ses-rest').value) || null),
      title:        document.getElementById('ses-title').value.trim() || null,
    };
    for (const item of sesSelectedIds) {
      const ex = exercises.find(e => e.id === item.exercise_id);
      if (ex) {
        const wa = ex.week_assignment || [];
        if (!wa.includes(planWeek)) {
          const updated = [...wa, planWeek];
          await db.from('exercises').update({ week_assignment: updated }).eq('id', item.exercise_id);
          ex.week_assignment = updated;
        }
      }
    }
    let error, savedId = editingSessionId;
    if (editingSessionId) {
      ({ error } = await db.from('sessions').update(payload).eq('id', editingSessionId));
    } else {
      let newData;
      ({ data: newData, error } = await db.from('sessions').insert([payload]).select().single());
      if (newData) { savedId = newData.id; editingSessionId = savedId; }
    }
    if (error) { toast('Fehler beim Speichern'); return; }
    toast(editingSessionId ? 'Session gespeichert' : 'Session erstellt');
    await loadSessions();
    renderPlan();
    render();
    const saved = sessions.find(s => s.id === savedId);
    closeSessionModal();
    if (saved && planDetailSes) { openPlanDetail(saved); }
  }
