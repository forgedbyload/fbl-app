  const SUP_COLORS = ['var(--hyper)', 'var(--vol)', 'var(--kraft)', 'var(--flex)'];
  function supGrpColor(g) { return SUP_COLORS[(g.charCodeAt(0) - 65) % SUP_COLORS.length]; }
  function nextGrpLetter() {
    const used = new Set(sesSelectedIds.map(e => e.superset_group).filter(Boolean));
    for (let i = 0; i < 26; i++) { const l = String.fromCharCode(65+i); if (!used.has(l)) return l; }
    return 'A';
  }
  function sesCanGroup() {
    if (sesSelectIdxs.size < 2) return false;
    const arr = [...sesSelectIdxs].sort((a,b)=>a-b);
    for (let i = 1; i < arr.length; i++) if (arr[i] !== arr[i-1]+1) return false;
    return arr.every(i => !sesSelectedIds[i]?.superset_group);
  }
  function sesDetectPairs() {
    const result = [];
    let i = 0;
    while (i < sesSelectedIds.length - 1) {
      if (sesSelectedIds[i].superset_group) { i++; continue; }
      let bestL = -1, bestRounds = 1;
      const maxL = Math.floor((sesSelectedIds.length - i) / 2);
      for (let L = 2; L <= maxL; L++) {
        let valid = true;
        for (let k = 0; k < L; k++) { if (sesSelectedIds[i+k]?.superset_group) { valid = false; break; } }
        if (!valid) continue;
        let rounds = 1, j = i + L;
        while (j + L <= sesSelectedIds.length) {
          let match = true;
          for (let k = 0; k < L; k++) {
            if (sesSelectedIds[j+k]?.exercise_id !== sesSelectedIds[i+k].exercise_id || sesSelectedIds[j+k]?.superset_group) { match = false; break; }
          }
          if (match) { rounds++; j += L; } else break;
        }
        if (rounds >= 2) { bestL = L; bestRounds = rounds; break; }
      }
      if (bestL >= 2) { result.push({ start: i, length: bestL, rounds: bestRounds }); i += bestL * bestRounds; }
      else i++;
    }
    return result;
  }

  function renderSesSelected() {
    const el = document.getElementById('ses-selected-list');
    if (!sesSelectedIds.length) { el.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:6px 0">Nothing added yet.</div>`; return; }

    let html = '';

    // Auto-suggest banner
    const detPairs = sesDetectPairs();
    if (detPairs.length && !sesSelectIdxs.size) {
      const lbl = detPairs.length === 1
        ? (() => { const {start,length,rounds} = detPairs[0]; const names = Array.from({length:length},(_,k)=>exercises.find(e=>e.id===sesSelectedIds[start+k]?.exercise_id)?.name||'').filter(Boolean); return `${names.join(' + ')}${rounds>1?' · '+rounds+'×':''}`;})()
        : `${detPairs.length} superset pairs detected`;
      const btnLbl = detPairs.length === 1 ? 'Mark as superset' : 'Mark all';
      html += `<div class="ses-sup-suggest"><span class="ses-sup-suggest-lbl">${lbl}</span><button type="button" class="btn-sup-suggest" id="ses-suggest-btn">${btnLbl}</button></div>`;
    }

    // Items: grouped blocks + ungrouped singles
    let i = 0;
    while (i < sesSelectedIds.length) {
      const grp = sesSelectedIds[i].superset_group;
      if (grp) {
        let j = i;
        while (j < sesSelectedIds.length && sesSelectedIds[j].superset_group === grp) j++;
        const rounds = sesSelectedIds[i].sets || 3;
        const color  = supGrpColor(grp);
        html += `<div class="ses-sup-block" style="border-color:${color}33"><div class="ses-sup-header" style="background:${color}11"><span class="ses-sup-header-lbl" style="color:${color}">Superset ${grp} · ${rounds} rounds</span><button type="button" class="ses-ungroup-btn" data-grp="${grp}">Ungroup</button></div>`;
        for (let k = i; k < j; k++) {
          const ex = exercises.find(e => e.id === sesSelectedIds[k].exercise_id);
          if (!ex) continue;
          html += `<div class="ses-sel-item grouped" data-idx="${k}" style="border-left-color:${color}"><span class="ses-drag-handle" style="visibility:hidden">⠿</span><span class="ses-sup-ex-lbl" style="color:${color}">${grp}${k-i+1}</span><span class="ses-sel-name">${ex.name}</span><input type="number" class="ses-sets-input" data-idx="${k}" min="1" max="10" value="${sesSelectedIds[k].sets||3}" title="Runden"><div class="ses-sel-btns"><button type="button" class="ses-remove-btn" data-id="${sesSelectedIds[k].exercise_id}">×</button></div></div>`;
        }
        html += `</div>`;
        i = j;
      } else {
        const ex = exercises.find(e => e.id === sesSelectedIds[i].exercise_id);
        if (!ex) { i++; continue; }
        const isSel = sesSelectIdxs.has(i);
        html += `<div class="ses-sel-item${isSel?' sel-active':''}" data-idx="${i}" draggable="${sesSelectIdxs.size?'false':'true'}"><div class="ses-sel-check">${isSel?'✓':''}</div><span class="ses-drag-handle">⠿</span><span class="ses-sel-name">${ex.name}</span><input type="number" class="ses-sets-input" data-idx="${i}" min="1" max="10" value="${sesSelectedIds[i].sets||3}" title="Sätze"><div class="ses-sel-btns"><button type="button" class="ses-remove-btn" data-id="${sesSelectedIds[i].exercise_id}">×</button></div></div>`;
        i++;
      }
    }

    // Group action bar
    if (sesSelectIdxs.size || sesSelectedIds.some(s => !s.superset_group)) {
      const canGrp = sesCanGroup();
      html += `<div class="ses-group-bar${sesSelectIdxs.size?' visible':''}"><button type="button" class="btn-sup-group" id="ses-btn-group"${canGrp?'':' disabled'}>Group as superset</button><button type="button" class="btn-sup-unsel" id="ses-btn-unsel">Deselect all</button></div>`;
    }

    el.innerHTML = html;

    // ── Events ────────────────────────────────────────────
    el.querySelectorAll('.ses-sel-item:not(.grouped)').forEach(row => {
      row.addEventListener('click', e => {
        if (e.target.closest('.ses-remove-btn,.ses-sets-input,.ses-drag-handle')) return;
        const idx = parseInt(row.dataset.idx);
        sesSelectIdxs.has(idx) ? sesSelectIdxs.delete(idx) : sesSelectIdxs.add(idx);
        renderSesSelected();
      });
    });
    el.querySelectorAll('.ses-sets-input').forEach(inp => {
      inp.addEventListener('change', () => {
        const idx = parseInt(inp.dataset.idx);
        const val = Math.min(10, Math.max(1, parseInt(inp.value) || 1));
        sesSelectedIds[idx].sets = val; inp.value = val;
        const g = sesSelectedIds[idx].superset_group;
        if (g) { sesSelectedIds.forEach((s,k) => { if (s.superset_group===g) sesSelectedIds[k].sets=val; }); renderSesSelected(); }
      });
    });
    el.querySelectorAll('.ses-remove-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        sesSelectedIds = sesSelectedIds.filter(s => s.exercise_id !== btn.dataset.id);
        sesSelectIdxs.clear();
        renderSesPool(document.getElementById('ses-search').value);
        renderSesSelected(); autoFillSesTitle();
      });
    });
    document.getElementById('ses-btn-group')?.addEventListener('click', () => {
      if (!sesCanGroup()) return;
      const letter = nextGrpLetter();
      const arr = [...sesSelectIdxs].sort((a,b)=>a-b);
      const selItems = arr.map(i => sesSelectedIds[i]);
      // Detect repeating sub-pattern within selection and collapse duplicates
      let collapsed = false;
      const maxL = Math.floor(selItems.length / 2);
      for (let L = 2; L <= maxL; L++) {
        let valid = true, rounds = 1;
        for (let r = 1; r * L < selItems.length; r++) {
          for (let k = 0; k < L; k++) {
            if (selItems[r*L+k]?.exercise_id !== selItems[k].exercise_id) { valid = false; break; }
          }
          if (!valid) break;
          rounds++;
        }
        if (valid && rounds >= 2 && L * rounds === selItems.length) {
          for (let k = 0; k < L; k++) { sesSelectedIds[arr[k]].superset_group = letter; sesSelectedIds[arr[k]].sets = rounds; }
          const toRemove = new Set(arr.slice(L));
          sesSelectedIds = sesSelectedIds.filter((_,i) => !toRemove.has(i));
          collapsed = true; break;
        }
      }
      if (!collapsed) {
        const refSets = sesSelectedIds[arr[0]].sets || 3;
        arr.forEach(i => { sesSelectedIds[i].superset_group = letter; sesSelectedIds[i].sets = refSets; });
      }
      sesSelectIdxs.clear(); renderSesSelected(); autoFillSesTitle();
    });
    document.getElementById('ses-btn-unsel')?.addEventListener('click', () => { sesSelectIdxs.clear(); renderSesSelected(); });
    el.querySelectorAll('.ses-ungroup-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const g = btn.dataset.grp;
        const grpItems = sesSelectedIds.filter(s => s.superset_group === g);
        if (!grpItems.length) return;
        const rounds = grpItems[0].sets || 3;
        const template = grpItems.map(s => ({ exercise_id: s.exercise_id, sets: 1 }));
        const expanded = [];
        for (let r = 0; r < rounds; r++) { template.forEach(t => expanded.push({...t})); }
        const startIdx = sesSelectedIds.findIndex(s => s.superset_group === g);
        sesSelectedIds.splice(startIdx, grpItems.length, ...expanded);
        renderSesSelected(); autoFillSesTitle();
      });
    });
    document.getElementById('ses-suggest-btn')?.addEventListener('click', () => {
      const toRemove = new Set();
      sesDetectPairs().forEach(({start, length, rounds}) => {
        const letter = nextGrpLetter();
        for (let k = 0; k < length; k++) { sesSelectedIds[start+k].superset_group = letter; sesSelectedIds[start+k].sets = rounds; }
        for (let r = 1; r < rounds; r++) { for (let k = 0; k < length; k++) { toRemove.add(start + r*length + k); } }
      });
      sesSelectedIds = sesSelectedIds.filter((_,i) => !toRemove.has(i));
      renderSesSelected(); autoFillSesTitle();
    });

    // ── Drag & drop (ungrouped only) ──────────────────────
    let dragIdx = null;
    el.querySelectorAll('.ses-sel-item[draggable="true"]').forEach(item => {
      item.addEventListener('dragstart', () => { dragIdx = parseInt(item.dataset.idx); setTimeout(() => item.classList.add('dragging'), 0); });
      item.addEventListener('dragend',   () => { item.classList.remove('dragging'); el.querySelectorAll('.ses-sel-item').forEach(i => i.classList.remove('drag-over')); });
      item.addEventListener('dragover',  e => { e.preventDefault(); el.querySelectorAll('.ses-sel-item').forEach(i => i.classList.remove('drag-over')); item.classList.add('drag-over'); });
      item.addEventListener('drop', e => {
        e.preventDefault(); const dropIdx = parseInt(item.dataset.idx); item.classList.remove('drag-over');
        if (dragIdx !== null && dragIdx !== dropIdx) { const moved = sesSelectedIds.splice(dragIdx,1)[0]; sesSelectedIds.splice(dropIdx,0,moved); renderSesSelected(); }
      });
    });
    let touchIdx = null, touchClone = null;
    el.querySelectorAll('.ses-sel-item:not(.grouped) .ses-drag-handle').forEach(handle => {
      const row = handle.closest('.ses-sel-item');
      handle.addEventListener('touchstart', e => {
        if (sesSelectIdxs.size) return;
        touchIdx = parseInt(row.dataset.idx);
        const rect = row.getBoundingClientRect();
        touchClone = row.cloneNode(true);
        Object.assign(touchClone.style, { position:'fixed', top:rect.top+'px', left:rect.left+'px', width:rect.width+'px', zIndex:'200', opacity:'.85', background:'var(--surface)', borderRadius:'8px', pointerEvents:'none', boxShadow:'0 4px 16px rgba(0,0,0,.5)', padding:'8px 0' });
        document.body.appendChild(touchClone); row.classList.add('dragging');
      }, { passive:true });
      handle.addEventListener('touchmove', e => {
        if (!touchClone) return;
        const t = e.touches[0]; touchClone.style.top = (t.clientY-24)+'px';
        el.querySelectorAll('.ses-sel-item').forEach(i => i.classList.remove('drag-over'));
        const over = document.elementFromPoint(t.clientX,t.clientY)?.closest('.ses-sel-item');
        if (over && over!==row) over.classList.add('drag-over');
      }, { passive:true });
      handle.addEventListener('touchend', () => {
        if (touchClone) { document.body.removeChild(touchClone); touchClone=null; }
        row.classList.remove('dragging');
        const over = el.querySelector('.ses-sel-item.drag-over');
        if (over) { const dropIdx=parseInt(over.dataset.idx); over.classList.remove('drag-over'); if (touchIdx!==null&&touchIdx!==dropIdx) { const moved=sesSelectedIds.splice(touchIdx,1)[0]; sesSelectedIds.splice(dropIdx,0,moved); } }
        touchIdx=null; renderSesSelected();
      });
    });
  }

  function autoFillSesTitle() {
    const mode = document.querySelector('.t-toggle[data-sesmode].on')?.dataset.sesmode;
    if (!mode) return;
    const exs = sesSelectedIds.map(s => exercises.find(e => e.id === s.exercise_id)).filter(Boolean);
    const regions = [...new Set(exs.flatMap(e => e.body_regions || []))];
    const REGION_LABELS = {chest:'Chest',back:'Back',shoulders:'Shoulders',arms:'Arms',legs:'Legs',core:'Core',mobility:'Flexibility'};
    const regionStr = regions.map(r => REGION_LABELS[r] || r).join(', ');
    document.getElementById('ses-title').value = regionStr ? `${cap(mode)}, ${regionStr}` : cap(mode);
  }

  document.getElementById('session-form').addEventListener('submit', async e => { e.preventDefault(); await saveSession(); });
  document.getElementById('session-btn-close').addEventListener('click', closeSessionModal);
  document.getElementById('session-overlay').addEventListener('click', e => { if (e.target === document.getElementById('session-overlay')) closeSessionModal(); });
  document.getElementById('ses-btn-delete').addEventListener('click', deleteSession);
  document.getElementById('ses-search').addEventListener('input', e => renderSesPool(e.target.value));
  document.querySelectorAll('#ses-region-tabs .filter-tab').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('#ses-region-tabs .filter-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    sesRegion = btn.dataset.region;
    renderSesPool(document.getElementById('ses-search').value);
  }));
  document.querySelectorAll('.t-toggle[data-weekday]').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.t-toggle[data-weekday]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
  }));
  document.querySelectorAll('.t-toggle[data-sesmode]').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.t-toggle[data-sesmode]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    document.getElementById('ses-work').value       = '';
    document.getElementById('ses-rest').value       = '';
    document.getElementById('ses-rep-target').value = '';
    updateSesModeUI();
  }));

  async function saveSession() {
    const weekday = document.querySelector('.t-toggle[data-weekday].on')?.dataset.weekday;
    const mode    = document.querySelector('.t-toggle[data-sesmode].on')?.dataset.sesmode;
    if (!weekday || !mode) { toast('Select a day and mode'); return; }
    const isFlex = mode === 'flexibility';
    const payload = {
      week:         planWeek,
      weekday,
      dup_mode:     mode,
      exercise_ids: sesSelectedIds.map(s => ({ exercise_id: s.exercise_id, sets: s.sets || 3, ...(s.superset_group ? { superset_group: s.superset_group } : {}) })),
      work_seconds: (isFlex || mode === 'kraft' || mode === 'hyper') ? null
        : (parseInt(document.getElementById('ses-work').value) || null),
      rest_seconds: isFlex ? null : (parseInt(document.getElementById('ses-rest').value) || null),
      title:        document.getElementById('ses-title').value.trim() || null,
    };
    for (const item of sesSelectedIds) {
      const ex = exercises.find(e => e.id === item.exercise_id);
      if (ex) {
        const wa = ex.week_assignment || [];
        if (!wa.includes(planWeek)) {
          const updated = [...wa, planWeek];
          await db.from('exercises').update({ week_assignment: updated }).eq('id', item.exercise_id);
          ex.week_assignment = updated;
        }
      }
    }
    let error, savedId = editingSessionId;
    if (editingSessionId) {
      ({ error } = await db.from('sessions').update(payload).eq('id', editingSessionId));
    } else {
      let newData;
      ({ data: newData, error } = await db.from('sessions').insert([payload]).select().single());
      if (newData) { savedId = newData.id; editingSessionId = savedId; }
    }
    if (error) { toast('Fehler beim Speichern'); return; }
    toast(editingSessionId ? 'Session gespeichert' : 'Session erstellt');
    await loadSessions();
    renderPlan();
    render();
    const saved = sessions.find(s => s.id === savedId);
    closeSessionModal();
    if (saved && planDetailSes) { openPlanDetail(saved); }
  }

  async function deleteSession() {
    if (!editingSessionId) return;
    await db.from('set_log').update({ session_id: null }).eq('session_id', editingSessionId);
    await db.from('training_log').update({ session_id: null }).eq('session_id', editingSessionId);
    const { error } = await db.from('sessions').delete().eq('id', editingSessionId);
    if (error) { toast('Fehler beim Löschen'); return; }
    toast('Session gelöscht');
    planDetailSes = null;
    closeSessionModal();
    await loadSessions();
    renderPlan();
    showPlanSub('week');
  }

  let tSession     = null;
  let skippedExIds = [];
  let doneExIds    = new Set();
  let tMode, tWeek, tExercises, exIdx, setIdx, phase;

  let slCallback = null;

  const SL_EQ_ORDER  = ['barbell','dumbbell_1x','dumbbell_2x','kettlebell_1x','kettlebell_2x'];
  const SL_EQ_LABELS = { barbell:'Barbell', dumbbell_1x:'Dumbbell 1x', dumbbell_2x:'Dumbbell 2x', kettlebell_1x:'KB 1x', kettlebell_2x:'KB 2x' };

  function computeTotalSets() {

  function slCheckPR(eq) {
    const inp   = document.getElementById(`sl-w-${eq}`);

  async function openSetLogModal(cb) {
    slCallback = cb;
    slRIR      = null;
    const ex     = tExercises[exIdx];
    const setNum = setIdx + 1;
    const total  = computeTotalSets();

    const { data } = await db.from('set_log')
      .select('equipment,weight_kg,reps,rir')
      .eq('exercise_id', ex.id)
      .eq('set_number', setNum)
      .eq('total_sets_in_session', total)
      .order('session_date', { ascending: false })

    const lastByEq = {};
    (data || []).forEach(row => {

    });

    slPRs = {};

      if (w.personal_record) slPRs[w.type] = w.personal_record;

    document.getElementById('sl-set-info').textContent = `Satz ${setNum} · Session gesamt: ${total} Sätze`;

      return `<div class="sl-eq-row">
        <span class="sl-eq-label">${SL_EQ_LABELS[eq]}</span>
        <input class="form-input" type="number" step="0.5" inputmode="decimal" id="sl-w-${eq}" placeholder="kg" value="${val}" data-eq="${eq}">
        <span class="sl-pr-badge" id="sl-pr-${eq}">PR</span>

    document.getElementById('sl-reps').value = Object.values(lastByEq)[0]?.reps ?? '';

  async function saveSetLogAndContinue() {
    const ex      = tExercises[exIdx];
    const reps    = parseInt(document.getElementById('sl-reps').value) || null;
    const today   = new Date().toISOString().split('T')[0];
    const total   = computeTotalSets();
    const setNum  = setIdx + 1;

    SL_EQ_ORDER.forEach(eq => {
      const val = parseFloat(document.getElementById(`sl-w-${eq}`)?.value);
      if (!isNaN(val) && val > 0) {
        rows.push({
          exercise_id:           ex.id,
          session_id:            tSession?.id ?? null,
          session_date:          today,
          set_number:            setNum,
          total_sets_in_session: total,
          weight_kg:             val,
          reps,
          rir:                   slRIR,
          equipment:             eq,
          dup_mode:              tMode ?? null,
          week:                  tWeek ?? null,
        });
      }
    });

    if (!rows.length && (reps || slRIR != null)) {
      rows.push({
        exercise_id:           ex.id,
        session_id:            tSession?.id ?? null,
        session_date:          today,
        set_number:            setNum,
        total_sets_in_session: total,
        weight_kg:             null,
        reps,
        rir:                   slRIR,
        equipment:             null,
        dup_mode:              tMode ?? null,
        week:                  tWeek ?? null,

  let _audioCtx = null;
  function getAudioCtx() {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return _audioCtx;
  }
  function playBeep(hz = 440, ms = 100) {
    try {
      const ctx  = getAudioCtx();
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = hz;
      gain.gain.setValueAtTime(0.35, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + ms / 1000);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + ms / 1000);
    } catch(e) {}
  }

  const taModeLbl   = document.getElementById('ta-mode-label');
  const taCounter   = document.getElementById('ta-counter');
  const taImg       = document.getElementById('ta-img');
  const taName      = document.getElementById('ta-name');
  const taDots      = document.getElementById('ta-dots');
  const ringFill    = document.getElementById('ring-fill');
  const taTime      = document.getElementById('ta-time');
  const taPhase     = document.getElementById('ta-phase');
  const taPauseHint = document.getElementById('ta-pause-hint');
  const taSkip      = document.getElementById('ta-skip');
  const taMain      = document.getElementById('ta-main');
  const doneMeta    = document.getElementById('done-meta');

  function startTrainingDirect(ses) {
    if (!ses) return;
    planDetailSes = ses;
    detailExSkip  = new Set();
    detailExSets  = {};
    (ses.exercise_ids||[]).forEach(cfg => {
      const id   = typeof cfg === 'string' ? cfg : cfg.exercise_id;
      const sets = typeof cfg === 'object' ? (cfg.sets||3) : 3;
      detailExSets[id] = sets;
    });
    openPreWorkoutScreen('direct');
  }

  async function launchTimer() {
    const ses = planDetailSes;
    if (!ses) return;
    await loadAppState();
    const rawWeek = appState.current_week || 'A';
    tWeek    = (!appState.week_b_enabled && rawWeek === 'B') ? 'A' : rawWeek;
    tSession = ses;
    tMode    = ses.dup_mode;
    getAudioCtx().resume();
    const pool = (ses.exercise_ids||[]).map(cfg => {
      const id   = typeof cfg === 'string' ? cfg : cfg.exercise_id;
      const sets = detailExSets[id] ?? (typeof cfg === 'object' ? (cfg.sets||3) : 3);
      const sgrp = typeof cfg === 'object' ? (cfg.superset_group || null) : null;
      const ex   = exercises.find(e => e.id === id);
      return ex ? { ...ex, _sets: sets, _superset_group: sgrp } : null;
    }).filter(Boolean);
    tExercises   = pool.filter(e => !detailExSkip.has(e.id));
    skippedExIds = pool.filter(e =>  detailExSkip.has(e.id)).map(e => e.id);
    doneExIds    = new Set();
    if (!tExercises.length) { toast('Keine Übungen ausgewählt'); return; }
    exIdx = 0; setIdx = 0;
    db.from('exercises').select('id,gif_base64').in('id', tExercises.map(e=>e.id)).then(({ data: gifRows }) => {
      if (!gifRows) return;
      const gifMap = Object.fromEntries(gifRows.map(r => [r.id, r.gif_base64]));
      tExercises = tExercises.map(e => ({ ...e, gif_base64: gifMap[e.id] ?? null }));
      updateExDisplay();
    });
    sessionStart = Date.now();
    taModeLbl.textContent = ses.title || `${cap(tMode)} · ${tWeek}`;
    ringFill.style.stroke = `var(--${tMode==='flexibility'?'flex':tMode})`;
    document.getElementById('setlog-overlay').classList.remove('open');
    slCallback = null;
    resetTimerUI();
    showPlanSub('timer');
    showTimerState('active');
    tMode === 'vol' ? startGetReady() : startExercise();
    timerLaunchedAt = Date.now();
  }

  function resetTimerUI() {
    document.getElementById('ta-work-layout').style.display  = 'flex';
    document.getElementById('ta-pause-layout').style.display = 'none';
    document.getElementById('ta-ring-wrap').style.display    = 'block';
    document.getElementById('ta-flex-controls').style.display = 'none';
    document.getElementById('ta-btns').style.display         = 'grid';
    document.getElementById('ta-weight-hint').style.display  = 'none';
  }

  // ── Exercise / set logic ──────────────────────────────
  function startGetReady() {
    updateExDisplay();
    phase = 'get-ready'; tDuration = 5; tStart = Date.now(); tPaused = false; tPausedRem = 5; lastBeepSecond = -1;
    ringFill.classList.remove('pulsing');
    taPhase.textContent = 'GET READY';
    taPauseHint.textContent = '';
    taMain.classList.add('ta-hidden');
    taSkip.classList.remove('ta-hidden');
    taSkip.textContent = 'Überspringen';
    document.getElementById('ta-work-layout').style.display  = 'flex';
    document.getElementById('ta-pause-layout').style.display = 'none';
    setRing(1); setTimeDisplay(5);
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(timerTick);
  }

  function startExercise() {
    updateExDisplay();
    if (tMode === 'flexibility') {
      enterFlexMode();
    } else if (tMode === 'kraft' || tMode === 'hyper') {
      enterRepsPhase();
      updateWorkHint();
    } else {
      startPhase('work', tSession?.work_seconds || DUP_CFG[tMode].workTime);
      updateWorkHint();
    }
  }

  function updateExDisplay() {
    const ex  = tExercises[exIdx];
    const cfg = DUP_CFG[tMode];
    taImg.innerHTML   = ex.gif_base64 ? `<img src="${ex.gif_base64}" loading="lazy">` : `<span class="ta-img-ph">💪</span>`;
    taName.textContent = ex.name;
    taCounter.textContent = `${exIdx+1} / ${tExercises.length}`;
    const sg = grpOf(exIdx);
    if (sg) {
      const gs = grpStart(exIdx), ge = grpEnd(exIdx);
      const rounds = tExercises[gs]._sets || 3;
      taDots.innerHTML = `<span class="ss-pos-indicator">Supersatz ${sg} · Runde ${setIdx+1}/${rounds} · Übung ${exIdx-gs+1}/${ge-gs+1}</span>`;
    } else if (tMode === 'kraft' || tMode === 'hyper') {
      taDots.innerHTML = `<span class="satz-progress">Satz ${setIdx+1} / ${ex._sets||3}</span>`;
    } else if (tMode === 'vol') {
      const ps = exIdx % 2 === 0 ? exIdx : exIdx - 1;
      const pt = tExercises[ps]?._sets || DUP_CFG.vol.sets;
      taDots.innerHTML = `<span class="satz-progress">Satz ${setIdx+1} / ${pt}</span>`;
    } else if (tMode !== 'flexibility') {
      taDots.innerHTML = Array.from({length:cfg.sets},(_,i)=>
        `<span class="set-dot${i<setIdx?' done':i===setIdx?' active':''}"></span>`).join('');
    } else {
      taDots.innerHTML = '';
    }
    document.getElementById('ta-weight-hint').style.display = 'none';
  }

  async function updateWorkHint() {
    const ex     = tExercises[exIdx];
    const setNum = setIdx + 1;
    const total  = computeTotalSets();
    const { data } = await db.from('set_log')
      .select('weight_kg,equipment,session_date')
      .eq('exercise_id', ex.id)
      .eq('set_number', setNum)
      .eq('total_sets_in_session', total)
      .order('session_date', { ascending: false })
      .limit(10);
    const WLBLS   = { barbell:'BB', dumbbell_1x:'DB 1x', dumbbell_2x:'DB 2x', kettlebell_1x:'KB 1x', kettlebell_2x:'KB 2x' };
    const lastEntry = (data||[]).find(r => r.weight_kg != null);
    const lastStr   = lastEntry?.weight_kg != null ? `Last: ${lastEntry.weight_kg}kg` : 'Last: —';
    const eqTypes   = [...new Set((data||[]).map(r => r.equipment).filter(Boolean))];
    const sw        = ex.strength_weights || [];
    const prParts   = eqTypes.map(eq => {
      const pr = sw.find(w => w.type === eq)?.personal_record;
      return pr != null ? (eqTypes.length > 1 ? `${WLBLS[eq]||eq} PR: ${pr}kg` : `PR: ${pr}kg`) : null;
    }).filter(Boolean);
    const wHint = document.getElementById('ta-weight-hint');
    wHint.textContent  = `Satz ${setNum} – ${[lastStr, ...prParts].join(' · ')}`;
    wHint.style.display = 'block';
  }

  function enterFlexMode() {
    phase = 'flex';
    if (rafId) { cancelAnimationFrame(rafId); rafId=null; }
    document.getElementById('ta-work-layout').style.display  = 'flex';
    document.getElementById('ta-pause-layout').style.display = 'none';
    document.getElementById('ta-ring-wrap').style.display    = 'none';
    document.getElementById('ta-flex-controls').style.display = 'flex';
    document.getElementById('ta-btns').style.display         = 'none';
    taPhase.textContent = 'FLEXIBILITY';
    taPauseHint.textContent = '';
    taTime.textContent = '';
    updateFlexControls();
  }

  function updateFlexControls() {
    document.getElementById('ta-flex-prev').disabled = exIdx === 0;
    const nextBtn = document.getElementById('ta-flex-next');
    nextBtn.textContent = exIdx >= tExercises.length-1 ? 'Fertig' : 'Weiter →';
    nextBtn.disabled = false;
  }

  document.getElementById('ta-flex-prev').addEventListener('click', () => {
    if (exIdx > 0) { exIdx--; updateExDisplay(); updateFlexControls(); }
  });
  document.getElementById('ta-flex-next').addEventListener('click', () => {
    if (exIdx >= tExercises.length-1) { showDone(); }
    else { exIdx++; updateExDisplay(); updateFlexControls(); }
  });

  function enterRepsPhase() {
    phase = 'reps';
    if (rafId) { cancelAnimationFrame(rafId); rafId=null; }
    document.getElementById('ta-work-layout').style.display  = 'flex';
    document.getElementById('ta-pause-layout').style.display = 'none';
    setRing(1); ringFill.classList.add('pulsing');
    taTime.textContent = tMode === 'hyper' ? 'REPS' : 'GO';
    taPhase.textContent = tMode === 'hyper' ? 'REPS' : 'AUSFÜHREN';
    taPauseHint.textContent = '';
    taMain.textContent='Satz beendet'; taMain.classList.remove('ta-hidden');
    taSkip.classList.add('ta-hidden');

  function startPhase(ph, dur) {
    phase=ph; tDuration=dur; tStart=Date.now(); tPaused=false; tPausedRem=dur; lastBeepSecond=-1;
    ringFill.classList.remove('pulsing');
    taPhase.textContent = ph === 'work' ? (tMode === 'vol' ? 'AMRAP' : 'ARBEIT') : 'PAUSE';
    taPauseHint.textContent = (ph === 'work' && tMode === 'vol') ? 'so viele Reps!' : 'Tippen zum Pausieren';
    taMain.classList.add('ta-hidden');
    taSkip.classList.remove('ta-hidden');
    taSkip.textContent = 'Überspringen';
    setRing(1); setTimeDisplay(dur);
    if (ph === 'rest') {
      document.getElementById('ta-work-layout').style.display  = 'none';
      document.getElementById('ta-pause-layout').style.display = 'flex';
      startPauseLayout(tExercises[exIdx], getNextExercise());
    } else {
      document.getElementById('ta-work-layout').style.display  = 'flex';
      document.getElementById('ta-pause-layout').style.display = 'none';
    }
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(timerTick);
  }

  function startPauseLayout(currentEx, nextEx) {
    document.getElementById('tap-prev-thumb').innerHTML = currentEx.gif_base64
      ? `<img src="${currentEx.gif_base64}">` : '💪';
    document.getElementById('tap-prev-lbl').textContent = `Gerade fertig: ${currentEx.name}`;
    const nextImgEl  = document.getElementById('tap-next-img');
    const nextNameEl = document.getElementById('tap-next-name');
    if (nextEx) {
      nextImgEl.innerHTML = nextEx.gif_base64
        ? `<img src="${nextEx.gif_base64}">` : '<span class="ta-img-ph">💪</span>';
      nextNameEl.textContent  = nextEx.name;
      nextImgEl.style.display  = 'flex';
      nextNameEl.style.display = 'block';
    } else {
      nextImgEl.style.display  = 'none';
      nextNameEl.style.display = 'none';
    }
    document.getElementById('tap-weights').innerHTML =
      '<span style="font-size:12px">Lädt…</span>';
    loadPauseWeights(nextEx);
  }

  async function loadPauseWeights(nextEx) {
    const el = document.getElementById('tap-weights');
    if (!nextEx) { el.innerHTML = ''; return; }
    const total = nextEx._sets || 3;
    const { data } = await db.from('set_log')
      .select('weight_kg,equipment,set_number,session_date')
      .eq('exercise_id', nextEx.id)
      .eq('total_sets_in_session', total)
      .gte('set_number', 1).lte('set_number', total)
      .order('session_date', { ascending: false });
    const WLBLS = { barbell:'BB', dumbbell_1x:'DB 1x', dumbbell_2x:'DB 2x', kettlebell_1x:'KB 1x', kettlebell_2x:'KB 2x' };
    const byEq = {};
    (data||[]).forEach(r => {
      if (!r.equipment || r.weight_kg == null) return;
      if (!byEq[r.equipment]) byEq[r.equipment] = {};
      if (byEq[r.equipment][r.set_number] == null) byEq[r.equipment][r.set_number] = r.weight_kg;
    });
    const eqTypes = Object.keys(byEq);
    if (!eqTypes.length) {
      el.innerHTML = `<span>${nextEx.name} – ${total} Sätze · —</span>`;
      return;
    }
    const header = `<div class="tap-w-label">${nextEx.name} – ${total} Sätze</div>`;
    const rows = eqTypes.map(eq => {
      const parts = Array.from({length:total},(_,i)=>i+1)
        .map(n => byEq[eq][n] != null ? `S${n}: ${byEq[eq][n]}kg` : null).filter(Boolean);
      const prefix = eqTypes.length > 1 ? `${WLBLS[eq]||eq}: ` : '';
      return `<div>${prefix}${parts.length ? parts.join(' · ') : '—'}</div>`;
    }).join('');
    el.innerHTML = header + rows;
  }

  function getNextExercise() {
    const sg = grpOf(exIdx);
    if (sg) {
      const gs = grpStart(exIdx), ge = grpEnd(exIdx);
      const rounds = tExercises[gs]._sets || 3;
      if (exIdx < ge)              return tExercises[exIdx + 1];
      if (setIdx + 1 < rounds)     return tExercises[gs];
      if (ge + 1 < tExercises.length) return tExercises[ge + 1];
      return null;
    }
    if (tMode === 'vol') {
      const pairStart = exIdx % 2 === 0 ? exIdx : exIdx - 1;
      const pairTotal = tExercises[pairStart]?._sets || DUP_CFG.vol.sets;
      const isA       = exIdx % 2 === 0;
      const hasPair   = pairStart + 1 < tExercises.length;
      if (isA && hasPair)          return tExercises[pairStart + 1];
      if (setIdx + 1 < pairTotal)  return tExercises[pairStart];          // B → A next set
      if (pairStart + 2 < tExercises.length) return tExercises[pairStart + 2]; // next pair
      return null;
    }
    const totalSets = (tMode === 'kraft' || tMode === 'hyper') ? (tExercises[exIdx]?._sets || 3) : DUP_CFG[tMode].sets;
    const nextExIdx = (setIdx+1 >= totalSets) ? exIdx+1 : exIdx;
    return nextExIdx < tExercises.length ? tExercises[nextExIdx] : null;
  }

  function timerTick() {
    if (tPaused) return;
    const elapsed   = (Date.now() - tStart) / 1000;
    const remaining = Math.max(0, tDuration - elapsed);
    setRing(remaining / tDuration);
    setTimeDisplay(remaining);
    const sec = Math.ceil(remaining);
    if ((phase === 'rest' || phase === 'get-ready') && remaining > 0 && sec <= 5 && sec !== lastBeepSecond) {
      lastBeepSecond = sec;
      sec === 1 ? playBeep(880, 150) : playBeep(440, 100);
    }
    if (remaining <= 0) { onPhaseEnd(); } else { rafId = requestAnimationFrame(timerTick); }
  }

  function onPhaseEnd() {
    if (rafId) { cancelAnimationFrame(rafId); rafId=null; }
    if (phase==='get-ready') { startExercise(); return; }
    if (phase==='work') {
      const lastInGrp = !grpOf(exIdx) || exIdx === grpEnd(exIdx);
      if (lastInGrp) openSetLogModal(() => {
        if (getNextExercise() === null) showDone();
        else startPhase('rest', tSession?.rest_seconds || DUP_CFG[tMode].restTime);
      });
      else           openSetLogModal(() => nextSet());
    } else { nextSet(); }
  }

  function grpOf(i)    { return tExercises[i]?._superset_group || null; }
  function grpStart(i) { const g=grpOf(i); if (!g) return i; while (i>0 && grpOf(i-1)===g) i--; return i; }
  function grpEnd(i)   { const g=grpOf(i); if (!g) return i; while (i+1<tExercises.length && grpOf(i+1)===g) i++; return i; }

  function nextSet() {
    const sg = grpOf(exIdx);
    if (sg) {
      const gs = grpStart(exIdx), ge = grpEnd(exIdx);
      const rounds = tExercises[gs]._sets || 3;
      if (exIdx < ge) { exIdx++; }
      else { setIdx++; if (setIdx >= rounds) { exIdx = ge+1; setIdx = 0; } else { exIdx = gs; } }
      if (exIdx >= tExercises.length) { showDone(); return; }
      startExercise(); return;
    }
    if (tMode === 'vol') {
      const pairStart = exIdx % 2 === 0 ? exIdx : exIdx - 1;
      const pairTotal = tExercises[pairStart]?._sets || DUP_CFG.vol.sets;
      const isA       = exIdx % 2 === 0;
      const hasPair   = pairStart + 1 < tExercises.length;
      if (isA && hasPair) {
        exIdx = pairStart + 1;                              // A → B (same set)
      } else {
        setIdx++;
        if (setIdx >= pairTotal) { exIdx = pairStart + 2; setIdx = 0; } // pair done → next pair
        else                     { exIdx = pairStart; }                  // B → A (next set)
      }
      if (exIdx >= tExercises.length) { showDone(); return; }
      startExercise();
      return;
    }
    setIdx++;
    const totalSets = (tMode === 'kraft' || tMode === 'hyper') ? (tExercises[exIdx]?._sets || 3) : DUP_CFG[tMode].sets;
    if (setIdx >= totalSets) { exIdx++; setIdx = 0; }
    if (exIdx >= tExercises.length) { showDone(); return; }
    startExercise();
  }

  // ── Pause (tap ring) ──────────────────────────────────
  document.getElementById('ta-ring-wrap').addEventListener('click', () => {
    if (phase==='reps') return;
    if (tPaused) {
      tStart = Date.now() - (tDuration - tPausedRem)*1000;
      tPaused = false; taPauseHint.textContent = 'Tippen zum Pausieren';
      rafId = requestAnimationFrame(timerTick);
    } else {
      tPausedRem = Math.max(0, tDuration - (Date.now()-tStart)/1000);
      tPaused = true;
      if (rafId) { cancelAnimationFrame(rafId); rafId=null; }
      taPauseHint.textContent = '⏸ Fortsetzen';
    }
  });

  taSkip.addEventListener('click', () => {
    if (rafId) { cancelAnimationFrame(rafId); rafId=null; }
    if (phase==='get-ready') { startExercise(); return; }
    if (phase==='work') startPhase('rest', tSession?.rest_seconds || DUP_CFG[tMode].restTime);
    else nextSet();
  });

  document.getElementById('ta-pause-skip').addEventListener('click', () => {
    if (rafId) { cancelAnimationFrame(rafId); rafId=null; }
    nextSet();
  });

  document.getElementById('ta-pause-log').addEventListener('click', () => {
    openSetLogModal(() => {});
  });

  document.getElementById('tap-time-row').addEventListener('click', () => {
    if (tPaused) {
      tStart  = Date.now() - (tDuration - tPausedRem) * 1000;
      tPaused = false;
      rafId   = requestAnimationFrame(timerTick);
    } else {
      tPausedRem = Math.max(0, tDuration - (Date.now() - tStart) / 1000);
      tPaused    = true;
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    }
  });

  taMain.addEventListener('click', () => {
    if (phase!=='reps') return;
    if (Date.now() - timerLaunchedAt < 500) return;
    const lastInGrp = !grpOf(exIdx) || exIdx === grpEnd(exIdx);
    if (lastInGrp) openSetLogModal(() => {
      if (getNextExercise() === null) showDone();
      else startPhase('rest', tSession?.rest_seconds || DUP_CFG[tMode].restTime);
    });
    else           openSetLogModal(() => nextSet());
  });

  document.getElementById('ta-exit').addEventListener('click', () => {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    document.getElementById('setlog-overlay').classList.remove('open');
    slCallback = null;
    resetTimerUI();
    if (preWorkoutFrom === 'direct') { showPlanSub('week'); }
    else if (planDetailSes) { showPlanSub('detail'); }
    else { showPlanSub('week'); }
  });

  function showDone() {
    if (rafId) { cancelAnimationFrame(rafId); rafId=null; }
    const mins = Math.round((Date.now()-sessionStart)/60000);
    const isFlex = tMode === 'flexibility';
    const sets = isFlex ? tExercises.length
      : (tMode === 'kraft' || tMode === 'hyper') ? tExercises.reduce((s,e)=>s+(e._sets||3),0)
      : tExercises.length * DUP_CFG[tMode].sets;
    doneMeta.innerHTML = `${tSession?.title||cap(tMode)} · Woche ${tWeek}<br>${tExercises.length} Übungen · ${sets} ${isFlex?'Exercises':'Sätze'} · ${mins} Min.`;
    resetTimerUI();
    showTimerState('done');
  }

  document.getElementById('btn-save-session').addEventListener('click', async () => {
    const mins   = Math.round((Date.now()-sessionStart)/60000);
    const isFlex = tMode === 'flexibility';
    const sets   = isFlex ? 0 : (tMode === 'kraft' || tMode === 'hyper') ? tExercises.reduce((s,e)=>s+(e._sets||3),0) : tExercises.length * DUP_CFG[tMode].sets;
    const { error } = await db.from('training_log').insert([{
      date:              new Date().toISOString().split('T')[0],
      session_id:        tSession?.id ?? null,
      exercises_skipped: skippedExIds,
      duration_minutes:  mins,
    }]);
    if (error) { toast('Fehler beim Speichern'); return; }
    const newWeek = await recalcCurrentWeek();
    const patch = { current_week: newWeek };
    Object.assign(appState, patch);
    if (appState.id) await db.from('app_state').update(patch).eq('id', appState.id);
    toast('Training gespeichert');
    tSession = null;
    await loadSessions();
    renderPlan();
    showPlanSub('week');
  });

  document.getElementById('btn-discard').addEventListener('click', () => {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    document.getElementById('setlog-overlay').classList.remove('open');
    slCallback = null;
    resetTimerUI();
    if (preWorkoutFrom === 'direct') { showPlanSub('week'); }
    else if (planDetailSes) { showPlanSub('detail'); }
    else { showPlanSub('week'); }
  });

  // ── Ring / time helpers ───────────────────────────────
  function setRing(progress) {
    ringFill.style.strokeDashoffset = CIRC * (1 - Math.max(0, Math.min(1, progress)));
  }
  function setTimeDisplay(seconds) {
    const s = Math.ceil(seconds), m = Math.floor(s/60), sec = s%60;
    const str = `${m}:${String(sec).padStart(2,'0')}`;
    taTime.textContent = str;
    const tapTimeEl = document.getElementById('tap-time');
    if (tapTimeEl) tapTimeEl.textContent = str;
  }

  // ── Week A/B auto-calculation ──────────────────────────
  async function recalcCurrentWeek() {
    const { count } = await db.from('training_log').select('*', { count:'exact', head:true });
    const week = Math.floor((count||0) / 6) % 2 === 0 ? 'A' : 'B';
    appState.current_week = week;
    return week;
  }

  // ═══════════════════════════════════════════════════════
  // MODUL 4 – Stats
  // ═══════════════════════════════════════════════════════
  const STATS_GROUPS = [
    { key: 'chest',     label: 'Chest' },
    { key: 'back',      label: 'Back' },
    { key: 'shoulders', label: 'Shoulders' },
    { key: 'arms',      label: 'Arms' },
    { key: 'legs',      label: 'Legs' },
    { key: 'core',      label: 'Core' },
  ];
  const STATS_EQ_LABELS = { barbell:'Barbell', dumbbell_1x:'DB 1x', dumbbell_2x:'DB 2x', kettlebell_1x:'KB 1x', kettlebell_2x:'KB 2x', bodyweight:'Bodyweight' };
  const STATS_EQ_COLORS = { barbell:'#000000', dumbbell_1x:'#3a6ea5', dumbbell_2x:'#5daab0', kettlebell_1x:'#c8a96e', kettlebell_2x:'#9b5de5', bodyweight:'#888888' };

  let statsByExercise = new Map();
  let statsExercise   = null;

  async function loadStatsData() {
    const { data, error } = await db.from('set_log')
      .select('exercise_id,equipment,weight_kg,reps,rir,session_date,set_number')
      .not('weight_kg', 'is', null)
      .not('reps', 'is', null)
      .order('session_date');
    if (error) { toast('Fehler beim Laden'); return; }
    statsByExercise = new Map();
    (data || []).forEach(r => {
      const eq = r.equipment || 'bodyweight';
      const row = { ...r, equipment: eq };
      if (!statsByExercise.has(row.exercise_id)) statsByExercise.set(row.exercise_id, []);
      statsByExercise.get(row.exercise_id).push(row);
    });
  }

  function showStatsSub(sub) {
    document.getElementById('stats-overview-sub').style.display = sub === 'overview' ? '' : 'none';
    document.getElementById('stats-exlist-sub').style.display   = sub === 'exlist'   ? '' : 'none';
    document.getElementById('stats-detail-sub').style.display   = sub === 'detail'   ? '' : 'none';
  }

  function calcE1RM(weight, reps) { return weight * (1 + reps / 30); }

  function statsDaysAgo(dateStr) {
    return (Date.now() - new Date(dateStr + 'T00:00:00').getTime()) / 86400000;
  }

  function statsFmtDate(dateStr) {
    const [y,m,d] = dateStr.split('-');
    return `${d}.${m}.`;
  }

  function statsMedian(arr) {
    if (!arr.length) return null;
    const s = [...arr].sort((a,b) => a-b);
    const mid = Math.floor(s.length/2);
    return s.length % 2 ? s[mid] : (s[mid-1]+s[mid]) / 2;
  }

  function statsTop3Median(values) {
    return statsMedian([...values].sort((a,b) => b-a).slice(0,3));
  }

  // Group rows by session_date, one point per session = highest e1RM working set
  // (working set = weight >= 85% of that session's max weight for the exercise)
  function statsBuildPoints(rows) {
    const bySession = new Map();
    rows.forEach(r => {
      if (!bySession.has(r.session_date)) bySession.set(r.session_date, []);
      bySession.get(r.session_date).push(r);
    });
    const points = [];
    bySession.forEach((sessionRows, date) => {
      const maxWeight = Math.max(...sessionRows.map(r => r.weight_kg));
      const workingSets = sessionRows.filter(r => r.weight_kg >= maxWeight * 0.85);
      let best = null;
      workingSets.forEach(r => {
        const e1rm = calcE1RM(r.weight_kg, r.reps);
        if (!best || e1rm > best.e1rm) best = { e1rm, weight: r.weight_kg, reps: r.reps, rir: r.rir, set_number: r.set_number };
      });
      points.push({ date, ...best, sessionRows });
    });
    return points.sort((a,b) => a.date.localeCompare(b.date));
  }

  function statsComputeMoM(points) {
    const thisMonth = points.filter(p => statsDaysAgo(p.date) <= 30).map(p => p.e1rm);
    const lastMonth = points.filter(p => { const d = statsDaysAgo(p.date); return d > 30 && d <= 60; }).map(p => p.e1rm);
    const thisVal = statsTop3Median(thisMonth);
    const lastVal = statsTop3Median(lastMonth);
    if (thisVal == null || lastVal == null || lastVal === 0) return null;
    return (thisVal - lastVal) / lastVal * 100;
  }

  function statsMoMStatus(mom) {
    if (mom == null) return 'grey';
    if (mom > 5)  return 'green-strong';
    if (mom >= 1) return 'green';
    if (mom >= -1) return 'grey';
    if (mom >= -5) return 'yellow';
    return 'red';
  }

  function statsMoMLabel(mom) {
    if (mom == null) return '—';
    return `${mom > 0 ? '+' : ''}${mom.toFixed(1)}%`;
  }

  function statsGroupByEquipment(rows) {
    const map = {};
    rows.forEach(r => (map[r.equipment] = map[r.equipment] || []).push(r));
    return map;
  }

  // Returns { state: 'none'|'baseline'|'tracking'|'ok', mom? }
  function statsExerciseStatus(rows) {
    if (!rows.length) return { state: 'none' };
    const points = statsBuildPoints(rows);
    if (points.length < 2) return { state: 'baseline' };
    if (statsDaysAgo(points[0].date) < 30) return { state: 'tracking' };
    return { state: 'ok', mom: statsComputeMoM(points) };
  }

  // ── Layer 1: muscle group overview ─────────────────────
  function renderStatsGroups() {
    const html = STATS_GROUPS.map(g => {
      const exList = exercises.filter(e => (e.body_regions||[]).includes(g.key));
      let tracked = 0, momSum = 0, momCount = 0;
      exList.forEach(e => {
        const rows = statsByExercise.get(e.id) || [];
        if (!rows.length) return;
        tracked++;
        const st = statsExerciseStatus(rows);
        if (st.state === 'ok' && st.mom != null) { momSum += st.mom; momCount++; }
      });
      const avgMom = momCount ? momSum / momCount : null;
      const status = avgMom != null ? statsMoMStatus(avgMom) : 'grey';
      return `<div class="stats-group-card" data-group="${g.key}">
        <div class="stats-group-name">${g.label}</div>
        <div class="stats-group-meta">${tracked} ${tracked===1?'Übung':'Übungen'} getrackt</div>
        <div class="stats-group-mom status-${status}">${statsMoMLabel(avgMom)}</div>
      </div>`;
    }).join('');
    document.getElementById('stats-groups').innerHTML = html;
    document.querySelectorAll('.stats-group-card').forEach(card =>
      card.addEventListener('click', () => openStatsExList(card.dataset.group)));
  }

  // ── Layer 2: exercise list ──────────────────────────────
  function openStatsExList(group) {
    const g = STATS_GROUPS.find(g => g.key === group);
    document.getElementById('stats-exlist-title').textContent = g?.label || '';
    showStatsSub('exlist');
    renderStatsExList(group);
  }

  function renderStatsExList(group) {
    const exList = exercises.filter(e => (e.body_regions||[]).includes(group));
    const el = document.getElementById('stats-exlist-body');
    if (!exList.length) { el.innerHTML = '<div class="empty-state">Keine Übungen.</div>'; return; }
    el.innerHTML = exList.map(e => {
      const thumb = e.thumbnail_base64 ? `<img src="${e.thumbnail_base64}" alt="">` : '';
      const rows = statsByExercise.get(e.id) || [];
      let body;
      if (!rows.length) {
        body = `<div class="stats-ex-sub">Not tracked yet</div>`;
      } else {
        const byEq = statsGroupByEquipment(rows);
        body = Object.entries(byEq).map(([eq, eqRows]) => {
          const points = statsBuildPoints(eqRows);
          const best = Math.max(...points.map(p => p.e1rm));
          let momHtml;
          if (points.length < 2) momHtml = `<span class="eq-mom status-grey">Building baseline</span>`;
          else if (statsDaysAgo(points[0].date) < 30) momHtml = `<span class="eq-mom status-grey">Tracking…</span>`;
          else { const mom = statsComputeMoM(points); momHtml = `<span class="eq-mom status-${statsMoMStatus(mom)}">${statsMoMLabel(mom)}</span>`; }
          return `<div class="stats-ex-eq">
            <span class="eq-name">${STATS_EQ_LABELS[eq]||eq}</span>
            <span class="eq-e1rm">${best.toFixed(1)} kg e1RM</span>
            ${momHtml}
          </div>`;
        }).join('');
      }
      return `<div class="stats-ex-row" data-id="${e.id}">
        <div class="stats-ex-thumb">${thumb}</div>
        <div class="stats-ex-info">
          <div class="stats-ex-name">${e.name}</div>
          ${body}
        </div>
      </div>`;
    }).join('');
    el.querySelectorAll('.stats-ex-row').forEach(row =>
      row.addEventListener('click', () => openStatsDetail(exercises.find(e => e.id === row.dataset.id))));
  }

  // ── Layer 3: exercise detail ────────────────────────────
  function openStatsDetail(ex) {
    statsExercise = ex;
    document.getElementById('stats-detail-title').textContent = ex.name;
    showStatsSub('detail');
    renderStatsDetail(ex);
  }

  function renderStatsDetail(ex) {
    const rows = statsByExercise.get(ex.id) || [];
    const el = document.getElementById('stats-detail-body');
    if (!rows.length) { el.innerHTML = '<div class="empty-state">Not tracked yet</div>'; return; }
    const pooledPoints = statsBuildPoints(rows);
    if (pooledPoints.length < 2) { el.innerHTML = '<div class="empty-state">Building baseline – need more data</div>'; return; }
    const pointsByEq = {};
    Object.entries(statsGroupByEquipment(rows)).forEach(([eq, eqRows]) => { pointsByEq[eq] = statsBuildPoints(eqRows); });
    el.innerHTML = `<div class="stats-chart-wrap" id="stats-chart"></div><div class="stats-insights" id="stats-insights"></div>`;
    renderStatsChart(pointsByEq, ex.id);
    renderStatsInsights(pointsByEq);
  }

  // ── Legend visibility persistence ──────────────────────
  function statsGetHiddenSeries() {
    try { return JSON.parse(localStorage.getItem('statsHiddenSeries') || '{}'); } catch { return {}; }
  }
  function statsSetHiddenSeries(key, hidden) {
    const map = statsGetHiddenSeries();
    if (hidden) map[key] = true; else delete map[key];
    localStorage.setItem('statsHiddenSeries', JSON.stringify(map));
  }

  function renderStatsChart(pointsByEq, exId) {
    const wrap = document.getElementById('stats-chart');
    const hiddenMap = statsGetHiddenSeries();
    const visibleEntries = Object.entries(pointsByEq).filter(([eq]) => !hiddenMap[`${exId}:${eq}`]);
    const allPoints = visibleEntries.flatMap(([,pts]) => pts);
    const legendHtml = `<div class="stats-legend">${Object.keys(pointsByEq).map(eq => {
      const isHidden = !!hiddenMap[`${exId}:${eq}`];
      return `<span class="legend-item${isHidden?' hidden-series':''}" data-eq="${eq}">
        <span class="legend-dot" style="background:${STATS_EQ_COLORS[eq]||'#000'}"></span>${STATS_EQ_LABELS[eq]||eq}
      </span>`;
    }).join('')}</div>`;

    if (!allPoints.length) {
      wrap.innerHTML = '<div class="empty-state">Keine Daten.</div>' + legendHtml;
      attachStatsLegendHandlers(pointsByEq, exId);
      return;
    }

    const dates = [...new Set(allPoints.map(p => p.date))].sort();

    // Y-axis: clean 5kg intervals, start at min(0, dataMin-5) rounded down to 5
    const rawMin = Math.min(...allPoints.map(p => p.e1rm));
    const rawMax = Math.max(...allPoints.map(p => p.e1rm));
    let yStart = Math.floor(Math.max(0, rawMin - 5) / 5) * 5;
    let yEnd   = Math.ceil(rawMax / 5) * 5;
    if (yEnd <= yStart) yEnd = yStart + 5;

    const W = 320, H = 220, ML = 38, MR = 10, MT = 10, MB = 46;
    const plotW = W - ML - MR, plotH = H - MT - MB;
    const xScale = date => dates.length > 1 ? ML + dates.indexOf(date)/(dates.length-1) * plotW : ML + plotW/2;
    const yScale = v => MT + (1 - (v-yStart)/(yEnd-yStart)) * plotH;

    let svg = `<svg viewBox="0 0 ${W} ${H}" class="stats-chart-svg" preserveAspectRatio="none">`;

    // Y grid + labels, every 5kg
    for (let v = yStart; v <= yEnd; v += 5) {
      const y = yScale(v);
      svg += `<line x1="${ML}" y1="${y.toFixed(1)}" x2="${W-MR}" y2="${y.toFixed(1)}" class="chart-grid"/>`;
      svg += `<text x="${ML-4}" y="${(y+3).toFixed(1)}" class="chart-axis-label" text-anchor="end">${v}</text>`;
    }

    // X labels: every date, rotated 45° if they'd overlap (<60px spacing)
    const labelSpacing = dates.length > 1 ? plotW/(dates.length-1) : plotW;
    const rotate = dates.length > 1 && labelSpacing < 60;
    dates.forEach(d => {
      const x = xScale(d);
      if (rotate) {
        svg += `<text x="${x.toFixed(1)}" y="${(H-MB+12).toFixed(1)}" class="chart-axis-label" text-anchor="end" transform="rotate(-45 ${x.toFixed(1)} ${(H-MB+12).toFixed(1)})">${statsFmtDate(d)}</text>`;
      } else {
        svg += `<text x="${x.toFixed(1)}" y="${(H-MB+14).toFixed(1)}" class="chart-axis-label" text-anchor="middle">${statsFmtDate(d)}</text>`;
      }
    });

    visibleEntries.forEach(([eq, points]) => {
      const color = STATS_EQ_COLORS[eq] || '#000';
      if (points.length > 1) {
        const path = points.map(p => `${xScale(p.date).toFixed(1)},${yScale(p.e1rm).toFixed(1)}`).join(' ');
        svg += `<polyline points="${path}" fill="none" stroke="${color}" stroke-width="2"/>`;
      }
      points.forEach(p => {
        const isSingle = points.length === 1;
        const r = isSingle ? 8 : 4;
        const cx = xScale(p.date), cy = yScale(p.e1rm);
        svg += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" fill="${color}" class="chart-dot" data-eq="${eq}" data-date="${p.date}"/>`;
        if (isSingle) {
          svg += `<text x="${(cx+12).toFixed(1)}" y="${(cy-10).toFixed(1)}" class="chart-point-label">${statsFmtDate(p.date)} · ${p.weight}kg×${p.reps}</text>`;
          svg += `<text x="${(cx+12).toFixed(1)}" y="${(cy+2).toFixed(1)}" class="chart-point-label">e1RM ${p.e1rm.toFixed(1)}kg</text>`;
          svg += `<text x="${(cx+12).toFixed(1)}" y="${(cy+13).toFixed(1)}" class="chart-point-note">single session</text>`;
        }
      });
    });
    svg += `</svg>`;

    wrap.innerHTML = svg + legendHtml + `<div class="chart-tooltip" id="chart-tooltip"></div>`;

    const tooltip = document.getElementById('chart-tooltip');
    wrap.querySelectorAll('.chart-dot').forEach(dot => {
      const eq = dot.dataset.eq, date = dot.dataset.date;
      const point = pointsByEq[eq].find(p => p.date === date);
      const isSingle = pointsByEq[eq].length === 1;
      if (!isSingle) {
        dot.addEventListener('mouseenter', () => {
          const wrapRect = wrap.getBoundingClientRect();
          const dotRect = dot.getBoundingClientRect();
          tooltip.innerHTML = `${statsFmtDate(point.date)} · ${STATS_EQ_LABELS[eq]||eq}<br>${point.weight}kg × ${point.reps} · e1RM ${point.e1rm.toFixed(1)}kg`;
          tooltip.style.left = (dotRect.left - wrapRect.left + dotRect.width/2) + 'px';
          tooltip.style.top  = (dotRect.top - wrapRect.top) + 'px';
          tooltip.classList.add('show');
        });
        dot.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
      }
      dot.addEventListener('click', () => showStatsSessionPopover(eq, point));
    });

    attachStatsLegendHandlers(pointsByEq, exId);
  }

  function attachStatsLegendHandlers(pointsByEq, exId) {
    document.querySelectorAll('#stats-chart .legend-item').forEach(item => {
      item.addEventListener('click', () => {
        const eq = item.dataset.eq;
        const key = `${exId}:${eq}`;
        const hiddenMap = statsGetHiddenSeries();
        statsSetHiddenSeries(key, !hiddenMap[key]);
        renderStatsChart(pointsByEq, exId);
      });
    });
  }

  function showStatsSessionPopover(eq, point) {
    document.getElementById('stats-session-title').textContent = `${statsFmtDate(point.date)} · ${STATS_EQ_LABELS[eq]||eq}`;
    const rows = point.sessionRows.map(r => {
      const e1rm = r.reps != null ? calcE1RM(r.weight_kg, r.reps) : null;
      return `<tr>
        <td>Set ${r.set_number ?? '—'}</td>
        <td>${r.weight_kg}kg × ${r.reps ?? '—'}</td>
        <td>RIR ${r.rir ?? '—'}</td>
        <td>${e1rm != null ? e1rm.toFixed(1)+' kg' : '—'}</td>
      </tr>`;
    }).join('');
    document.getElementById('stats-session-table').innerHTML =
      `<thead><tr><th>Set</th><th>Weight × Reps</th><th>RIR</th><th>e1RM</th></tr></thead><tbody>${rows}</tbody>`;
    document.getElementById('stats-session-overlay').classList.add('open');
  }

  function renderStatsInsights(pointsByEq) {
    const el = document.getElementById('stats-insights');
    el.innerHTML = Object.entries(pointsByEq).map(([eq, points]) => {
      if (!points.length) return '';
      let prWeight = 0, prDate = null;
      points.forEach(p => p.sessionRows.forEach(r => {
        if (r.weight_kg > prWeight) { prWeight = r.weight_kg; prDate = p.date; }
      }));
      const daysSincePR = prDate != null ? Math.floor(statsDaysAgo(prDate)) : null;
      const last = points[points.length-1];

      let momHtml;
      if (points.length < 2) momHtml = `<span class="status-grey">Building baseline</span>`;
      else if (statsDaysAgo(points[0].date) < 30) momHtml = `<span class="status-grey">Tracking…</span>`;
      else { const mom = statsComputeMoM(points); momHtml = `<span class="status-${statsMoMStatus(mom)}">${statsMoMLabel(mom)}</span>`; }

      return `<div class="stats-insight-card">
        <div class="stats-insight-title">${STATS_EQ_LABELS[eq]||eq}</div>
        <div class="stats-insight-row"><span>All-time PR</span><span>${prWeight} kg</span></div>
        <div class="stats-insight-row"><span>Current working weight</span><span>${last.weight} kg</span></div>
        <div class="stats-insight-row"><span>Days since PR</span><span>${daysSincePR ?? '—'}</span></div>
        <div class="stats-insight-row"><span>MoM</span>${momHtml}</div>
      </div>`;
    }).join('');
  }

  document.getElementById('stats-exlist-back').addEventListener('click', () => showStatsSub('overview'));
  document.getElementById('stats-detail-back').addEventListener('click', () => showStatsSub('exlist'));
  document.getElementById('stats-session-close').addEventListener('click', () =>
    document.getElementById('stats-session-overlay').classList.remove('open'));

  // ═══════════════════════════════════════════════════════
  // Util
  // ═══════════════════════════════════════════════════════
  function cap(s) { return s ? s.charAt(0).toUpperCase()+s.slice(1) : ''; }

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  load();
  loadAppState().then(() => { applyWeekBState(); loadSessions().then(() => { showPlanSub('week'); renderPlan(); }); });
</script>
</body>
</html>
